  // its lines had been fetched -- but an expansion restored from a previous
  // visit arrives before them, so the first render sees the counts with none of
  // the lines. Keyed on the counts alone, that render's short array was handed
  // back to the render that followed it, painting the hunk's own text onto the
  // expanded rows above it: line 1 reading "line 077".
  const key = hunkIdx + ":" + open.up + ":" + open.down + ":" + lines.length;
  const perFile = state.hl[file.path] || (state.hl[file.path] = {});
  if (!perFile[key]) perFile[key] = highlightRows(lines, lang);
  return perFile[key];
}

/* ---------------- the diff pane: every file, one page ---------------- */

// ROW_HEIGHT_GUESS is what an unbuilt file's placeholder is sized with, in px.
// It only has to be close: the moment a file is built its real height is
// measured and kept, so the guess is never used for it again.
const ROW_HEIGHT_GUESS = 19;

// MOUNT_MARGIN is how far outside the viewport a file is built, in px. Roughly a
// screen either way, so scrolling at a normal pace never reaches an empty one.
const MOUNT_MARGIN = 1200;

// renderDiff draws every changed file, in the order the navigator lists them.
//
// One page rather than one file at a time, which is what a review actually is:
// the reader scrolls through the change and the navigator says where they are,
// instead of the navigator being the only way to move.
//
// Only the files near the viewport are built. A diff of this repo is sixty files
// and twelve thousand lines; building all of it took the best part of a second,
// and the pane is rebuilt on every poll, so it would have spent half its life
// laying out code nobody was looking at. An unbuilt file is a spacer of its own
// height -- guessed until it has been built once, measured every time after --
// so the scrollbar means the same thing whether or not the rows behind it exist
// yet.
function renderDiff() {
  const pane = $("diff");
  const files = orderedFiles();

  if (!files.length) {
    pane.replaceChildren(el("div", "empty",
      state.snapshot.error ? state.snapshot.error : "No changes to review."));
    state.sections = {};
    return;
  }

  // Rebuilding a section changes nothing above it, but the browser still
  // reports scrollTop before layout settles; holding it makes the pane sit
  // still through a poll.
  const keepScroll = pane.scrollTop;
  reconcileSections(pane, files);
  for (const file of files) {
    const section = state.sections[file.path];
    if (nearViewport(pane, section.el)) mountSection(section, file);
    else unmountSection(section);
  }
  pane.scrollTop = keepScroll;
}

// orderedFiles returns the files in the order the navigator shows them, which is
// the tree's order and not the snapshot's.
//
// Built from the same walk the navigator uses, so the two cannot disagree about
// what comes next -- a page whose order differs from its own index is worse than
// either order on its own.
function orderedFiles() {
  // Cached against the snapshot's digest: this runs on every scroll frame, and
  // rebuilding the tree sixty files deep to answer "what order are they in" is
  // work that only changes when the diff does.
  const stamp = (state.snapshot && state.snapshot.digest) || "";
  if (state.orderStamp !== stamp) {
    const out = [];
    collectFiles(buildTree((state.snapshot && state.snapshot.files) || []), out);
    state.orderStamp = stamp;
    state.order = out;
  }
  return state.order;
}

function collectFiles(node, out) {
  const dirs = Array.from(node.dirs.values()).sort((a, b) => a.name.localeCompare(b.name));
  for (const d of dirs) collectFiles(collapseChain(d).node, out);
  for (const f of node.files.slice().sort((a, b) => a.path.localeCompare(b.path))) out.push(f);
}

// reconcileSections makes the pane hold one section per file, in order, reusing
// the elements that are already there.
//
// Reused rather than rebuilt because a section remembers two things worth
// keeping: its measured height, and whether its rows are currently built.
// Recreating them every render would lose both and undo the point of the whole
// arrangement.
function reconcileSections(pane, files) {
  const wanted = new Set(files.map((f) => f.path));
  for (const path of Object.keys(state.sections)) {
    if (!wanted.has(path)) delete state.sections[path];
  }

  const order = [];
  for (const file of files) {
    let section = state.sections[file.path];
    if (!section) {
      const wrap = el("section", "file");
      wrap.dataset.path = file.path;
      section = {
        el: wrap, head: null, body: el("div", "file-body"),
        digest: null, height: estimateHeight(file), mounted: false,
      };
      // Sized before it is measured, or every section would start at zero
      // height, stack at the top of the pane, and all of them would count as
      // near the viewport -- mounting the whole diff on the first render, which
      // is the one thing this arrangement exists to avoid.
      section.body.style.minHeight = Math.round(section.height) + "px";
      wrap.appendChild(section.body);
      state.sections[file.path] = section;
    }
    // The head is cheap and carries the read tick, so it is redrawn every time.
    const head = fileHead(file);
    if (section.head) section.el.replaceChild(head, section.head);
    else section.el.insertBefore(head, section.body);
    section.head = head;
    order.push(section.el);
  }

  // replaceChildren with the full list handles creation, removal and reordering
  // in one go, and leaves elements that are already in the right place alone.
  const current = Array.from(pane.children);
  if (current.length !== order.length || current.some((node, i) => node !== order[i])) {
    pane.replaceChildren(...order);
  }
}

// estimateHeight guesses a file's height from its row count, for the placeholder
// it gets before it has ever been built.
function estimateHeight(file) {
  let rows = 0;
  for (const hunk of file.hunks || []) rows += (hunk.lines || []).length + 1;
  return rows * ROW_HEIGHT_GUESS;
}

function nearViewport(pane, node) {
  const paneBox = pane.getBoundingClientRect();
  const box = node.getBoundingClientRect();
  return box.bottom > paneBox.top - MOUNT_MARGIN && box.top < paneBox.bottom + MOUNT_MARGIN;
}

// mountSection builds a file's rows, or leaves them alone if they are already
// built and nothing about them has changed.
function mountSection(section, file) {
  const stamp = sectionStamp(file);
  if (section.mounted && section.digest === stamp) return;

  section.body.replaceChildren(...fileBody(file));
  section.digest = stamp;
  section.mounted = true;
  // Measured now, and used from here on for the placeholder: after one build
  // the placeholder is the file's real height, so unmounting it cannot move
  // anything below it.
  section.height = section.body.getBoundingClientRect().height;
  section.body.style.minHeight = "";
}

// unmountSection replaces a file's rows with a spacer of the same height.
function unmountSection(section) {
  if (!section.mounted) return;
  section.body.replaceChildren();
  section.body.style.minHeight = Math.round(section.height) + "px";
  section.mounted = false;
  section.digest = null;
}

// sectionStamp is everything about a file that changes what its rows look like.
//
// A file whose stamp has not moved is left in the DOM untouched, which is what
// keeps a poll from rebuilding four screens of code every two seconds -- and
// what keeps the reply box the reader is typing in from being rebuilt under
// them more often than it must be.
function sectionStamp(file) {
  const threads = threadsFor(file.path).map((t) =>
    t.id + (t.resolved ? "r" : "") + (t.sent ? "s" : "") +
    (t.replies || []).length + (isCollapsed(t) ? "c" : "") +
    (state.replies[t.id] !== undefined ? "w" : "")).join(",");
  const form = state.form && state.form.path === file.path
    ? state.form.side + state.form.start + "-" + state.form.end : "";
  const open = JSON.stringify(state.expand[file.path] || {});
  const cached = (state.lineCache[file.path] || new Map()).size;
  return [file.digest, threads, form, open, cached,
    state.split ? "s" : "u", state.theme].join("|");
}

// fileBody builds the nodes for one file: its notes, its hunks and the bars
// between them, and any comment left stranded by a change.
function fileBody(file) {
  const out = [];
  if (file.error) out.push(noteEl(file.error));
  if (file.binary) out.push(noteEl("Binary file — not shown."));
  if (file.large) out.push(noteEl("File is too large to display."));

  const threads = threadsFor(file.path);
  const hunks = file.hunks || [];
  if (!hunks.length && !file.binary && !file.large && !file.error) {
    out.push(noteEl("No textual diff for this file."));
  }

  // Before the lines are built from them, not after: an overshooting count
  // would already have rendered a duplicated line by then.
  clampExpansion(file);
  const linesByHunk = hunks.map((_, i) => effectiveLines(file, i));
  const at = placeThreads(file, threads, linesByHunk);
  const lang = languageFor(file.path);
  ensureLineTotal(file);
  refillExpanded(file);

  const draw = state.split ? rowsTableSplit : rowsTable;
  for (let i = 0; i < hunks.length; i++) {
    const bar = gapBar(file, i);
    if (bar) out.push(bar);
    const table = draw(file, hunks[i], i, linesByHunk[i], threads, at,
      highlightFor(file, i, linesByHunk[i], lang));
    // One line-number width per file, so hunks expanded until they touch read
    // as continuous code rather than stepping sideways.
    sizeLineColumns(table, linesByHunk);
    out.push(table);
  }
  if (hunks.length) {
    const tailBar = gapBar(file, hunks.length);
    if (tailBar) out.push(tailBar);
  }

  // Comments whose anchor no longer appears in the diff still have to be
  // visible: the agent may have already changed the code they were about, and a
  // thread that silently vanishes looks like it was never sent.
  const orphans = threads.filter((t) => !at.has(t.id));
  if (orphans.length) {
    const wrap = el("div", "thread-cell");
    wrap.style.paddingLeft = "16px";
    wrap.appendChild(noteEl("Comments whose lines are no longer in the diff:"));
    for (const t of orphans) wrap.appendChild(threadCard(t));
    out.push(wrap);
  }

  const form = state.form;
  if (form && form.path === file.path && !rowFor(linesByHunk, form.side, form.end)) {
    const wrap = el("div", "thread-cell");
    wrap.style.paddingLeft = "16px";
    wrap.appendChild(noteEl("The lines this comment was on are no longer in the diff:"));
    wrap.appendChild(formCard(form));
    out.push(wrap);
  }
  return out;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/* ---------------- which file am I looking at ---------------- */

// spyScroll names the file under the top of the pane.
//
// The navigator stops being the only way to move and becomes a report of where
// the reader is, so it has to follow the scroll rather than the other way round.
// The file chosen is the last one whose head has reached the top of the pane,
// which is the one whose code fills the screen -- not the one nearest the
// middle, which flickers between neighbours on a short file.
function spyScroll() {
  if (state.scrollingTo) return;
  const pane = $("diff");
  const top = pane.getBoundingClientRect().top + 1;

  let current = null;
  for (const file of orderedFiles()) {
    const section = state.sections[file.path];
    if (!section) continue;
    if (section.el.getBoundingClientRect().top <= top) current = file.path;
  }
  if (!current) {
    const first = orderedFiles()[0];
    current = first ? first.path : null;
  }
  if (!current || current === state.file) return;

  state.file = current;
  readUnread(current);
  // Only the parts that name the file: a full render would rebuild rows on
  // every scroll frame.
  renderFiles();
  renderTitle();
  history.replaceState(null, "", location.pathname + location.search + "#" + encodeURIComponent(current));
}

// sizeLineColumns publishes the widest line number in the file as a custom
// property the gutter cells size themselves from.
//
// Set on each table rather than on the pane, now that every file is on one page:
// a single value for the whole pane would size a three-digit file's gutter for
// whichever file in the diff happens to be the longest.
function sizeLineColumns(node, linesByHunk) {
  let widest = 0;
  for (const lines of linesByHunk) {
    for (const line of lines) {
      if (line.old > widest) widest = line.old;
      if (line.new > widest) widest = line.new;
    }
  }
  node.style.setProperty("--ln-ch", String(String(widest || 0).length));
}

// rowFor reports whether a line number is on screen for the given side.
function rowFor(linesByHunk, side, number) {
  for (const lines of linesByHunk) {
    for (const line of lines) {
      if ((side === "old" ? line.old : line.new) === number) return true;
    }
  }
  return false;
}

// fileHead is the sticky bar naming the file, and where it is marked read.
function fileHead(file) {
  const head = document.createElement("div");
  head.className = "file-head";
  head.innerHTML = '<span class="tag">' + esc(file.status) + "</span>" +
    (file.oldPath ? "<span>" + esc(file.oldPath) + " &rarr; </span>" : "") +
    "<span>" + esc(file.path) + "</span>" +
    '<span class="spacer"></span>' +
    '<span class="stat"><span class="a">+' + file.added + '</span> <span class="d">-' + file.removed + "</span></span>";

  const seen = state.viewed.has(file.path);
  head.appendChild(button(
    seen ? "✓ Read" : "Mark read",
    "btn small" + (seen ? "" : " ghost"),
    () => setViewed(file.path, !seen),
  ));
  return head;
}

function noteEl(text) {
  const el = document.createElement("div");
  el.className = "note";
  el.textContent = text;
  return el;
}

// splitMarker separates a diff line's +/-/space prefix from the line itself, so
// the marker can be rendered in its own column.
//
// Anything else in that position is left alone and shown whole: git's
// "\ No newline at end of file" is not a line of the file and has no marker to
// strip, and cutting its first character would silently mangle it.
function splitMarker(content) {
  const c = String(content === undefined || content === null ? "" : content);
  const first = c.charAt(0);
  if (first === "+" || first === "-") return [first, c.slice(1)];
  if (first === " ") return ["", c.slice(1)];
  return ["", c];
}

// formCovers is the draft comment's equivalent of coversLine, so the lines being
// commented on stay marked while the reader is still typing. Losing the marking
// the moment the drag ends is what made a multi-line comment look like it had
// landed on one line.
function formCovers(form, file, line) {
  if (!form || form.path !== file.path) return false;
  const n = form.side === "old" ? line.old : line.new;
  return !!n && n >= form.start && n <= form.end;
}

// paintPick shows the current selection by toggling a class on the rows that are
// already there.
//
// It exists because rebuilding the table mid-drag silently loses the drag. The
// mousedown lands on a cell; a re-render then destroys that cell, and Chrome has
// nowhere to deliver the matching mouseup, so the document handler that commits
// the range never runs. The reader releases the mouse and no comment form opens
// -- and `state.dragging` is left armed, so their *next* click anywhere finishes
// the stale drag and opens a form on lines they are no longer looking at. A real
// mouse hid this most of the time, because any movement after the last re-render
// re-targets the pointer at a live cell; releasing without that final jiggle did
// not.
//
// Repainting instead of re-rendering is also simply cheaper: crossing a row costs
// a class toggle rather than rebuilding every row in the hunk.
// armDrag starts a range selection and takes the measurements it will be
// steered by.
//
// The rows are measured once, here, in *pane content* coordinates -- offsets
// from the top of the scrollable content rather than from the top of the
// window. Those do not move when the pane scrolls, so a drag that scrolls the
// pane keeps resolving correctly, and nothing has to re-measure on every mouse
// move. It is safe to cache because the drag itself no longer re-renders: from
// here until the release, only classes change.
function armDrag(file, hunk, lines, index, side) {
  state.dragging = true;
  state.picking = {
    path: file.path, hunk: hunk.header, side: side,
    from: index, to: index, lines: lines,
    rows: measureRows(file.path, hunk.header, side),
  };
  paintPick();
}

function measureRows(path, hunkHeader, side) {
  const pane = $("diff");
  const top = pane.getBoundingClientRect().top - pane.scrollTop;
  const out = [];
  for (const tr of pane.querySelectorAll("tr.row")) {
    if (tr.dataset.file !== path || tr.dataset.hunk !== hunkHeader) continue;
    const raw = state.split ? tr.dataset[side] : tr.dataset.i;
    if (raw === undefined || raw === "") continue;
    const box = tr.getBoundingClientRect();
    out.push({ index: +raw, top: box.top - top, bottom: box.bottom - top });
  }
  return out;
}

// extendPick moves the end of the range to the row nearest the pointer.
//
// Nearest, not "the row under the pointer": the gutter a drag starts in is 22px
// wide and a comment card is the full width of the pane, so any range spanning
// a card has to cross something that is not a row at all. Tracking entry into
// the gutter cell -- which is what this replaced -- meant the range stopped
// following the moment the pointer drifted out of that narrow column, and a
// comment sitting in the middle of a range guaranteed it did. Distance to the
// nearest row carries the selection straight over the card.
function extendPick(clientY) {
  const pick = state.picking;
  if (!pick || !pick.rows.length) return;
  const pane = $("diff");
  const y = clientY - pane.getBoundingClientRect().top + pane.scrollTop;

  let best = pick.rows[0].index;
  let bestDist = Infinity;
  for (const row of pick.rows) {
    const dist = y < row.top ? row.top - y : y > row.bottom ? y - row.bottom : 0;
    if (dist < bestDist) {
      bestDist = dist;
      best = row.index;
    }
    if (dist === 0) break;
  }
  if (best !== pick.to) {
    pick.to = best;
    paintPick();
  }
}

function paintPick() {
  const pick = state.picking;
  const lo = pick ? Math.min(pick.from, pick.to) : 0;
  const hi = pick ? Math.max(pick.from, pick.to) : -1;
  const inRange = (raw) => {
    if (raw === undefined || raw === "") return false;
    const i = +raw;
    return i >= lo && i <= hi;
  };

  // Unified rows are picked whole. A split row is picked one side at a time,
  // because a range on the left is about removed lines and the two sides do not
  // even share line numbers -- so the class goes on the side, not the row.
  for (const tr of document.querySelectorAll("#diff tr.row")) {
    const same = !!pick && tr.dataset.file === pick.path && tr.dataset.hunk === pick.hunk;
    tr.classList.toggle("picked", same && !state.split && inRange(tr.dataset.i));
    if (!state.split) continue;
    const mine = same;
    tr.classList.toggle("picked-left", mine && pick.side === "left" && inRange(tr.dataset.left));
    tr.classList.toggle("picked-right", mine && pick.side === "right" && inRange(tr.dataset.right));
  }
}

function rowsTable(file, hunk, hunkIdx, lines, threads, at, hl) {
  const table = document.createElement("table");
  table.className = "rows";
  const body = document.createElement("tbody");

  lines.forEach((line, i) => {
    const tr = document.createElement("tr");
    tr.className = "row " + (line.kind === "add" ? "add" : line.kind === "del" ? "del" : "ctx");
    if (line.expanded) tr.classList.add("expanded");
    tr.dataset.old = line.old || 0;
    tr.dataset.new = line.new || 0;
    tr.dataset.kind = line.kind;
    // Position within the hunk, so paintPick can find this row again without
    // the table being rebuilt underneath the pointer. The path goes with it
    // because a `@@` header is only unique within one file, and every file is
    // now on the same page.
    tr.dataset.i = i;
    tr.dataset.hunk = hunk.header;
    tr.dataset.file = file.path;

    const pick = state.picking;
    if (pick && pick.path === file.path && pick.hunk === hunk.header &&
        i >= Math.min(pick.from, pick.to) && i <= Math.max(pick.from, pick.to)) {
      tr.classList.add("picked");
    }

    // Mark every line a comment covers, single or ranged alike. A comment on one
    // line gets the same bar as a comment on twenty: the question the reader is
    // asking of the margin is "which lines is this about", and it has the same
    // answer either way.
    const covering = threads.filter((t) => coversLine(t, line));
    if (covering.length) {
      tr.classList.add("commented");
      if (covering.every((t) => t.resolved)) tr.classList.add("mark-done");
    }
    if (formCovers(state.form, file, line)) tr.classList.add("pending");

    const old = document.createElement("td");
    old.className = "ln";
    old.textContent = line.old ? line.old : "";
    const nw = document.createElement("td");
    nw.className = "ln";
    nw.textContent = line.new ? line.new : "";
    const act = document.createElement("td");
    act.className = "act";
    // A pencil, not a plus: the sign column immediately to its right now holds
    // the diff's own +, and two plus signs side by side read as one glyph.
    act.textContent = "✎";
    act.title = "Comment on this line — drag to cover several";
    const [marker, text] = splitMarker(line.content);
    const sign = document.createElement("td");
    sign.className = "sign";
    sign.textContent = marker;
    const code = document.createElement("td");
    code.className = "code";
    // innerHTML only ever receives highlight.js output, which has escaped the
    // line's own text on the way through. Nothing else is interpolated here.
    const painted = hl && hl[i];
    if (painted) {
      code.classList.add("hl");
      code.innerHTML = painted;
    } else {
      code.textContent = text;
    }

    // Dragging over the gutter is what turns a line comment into a range one.
    // The whole row is not the handle: selecting the code text is how a
    // reviewer copies it, and making the row a drag surface takes that away.
    act.addEventListener("mousedown", (e) => {
      e.preventDefault();
      armDrag(file, hunk, lines, i, "unified");
    });

    tr.append(old, nw, act, sign, code);
    body.appendChild(tr);

    // The card renders after the last line of its range, so the marked lines
    // above read as the quote and the card as what is being said about them.
    for (const t of threads) {
      const spot = at.get(t.id);
      if (!spot || spot.hunk !== hunkIdx) continue;
      const n = t.side === "old" ? line.old : line.new;
      if (n && n === spot.line) body.appendChild(threadRow(t));
    }

    const form = state.form;
    if (form && form.path === file.path) {
      const n = form.side === "old" ? line.old : line.new;
      if (n && n === form.end) body.appendChild(formRow(form));
    }
  });

  table.appendChild(body);
  return table;
}

/* ---------------- split view ---------------- */

// splitRows pairs a hunk's unified lines into side-by-side rows.
//
// A unified hunk is runs of context, removals and additions. Context belongs to
// both sides at once. A run of removals and the run of additions that follows it
// are one edit seen from two sides, so they are zipped index-wise -- which is
// what puts a rewritten line opposite the line it replaced instead of below it.
// The longer run leaves the other side blank for its remaining rows.
//
// Each side carries the line's index in the unified list, not the line itself.
// Everything else already keys off that index -- the highlight cache, range
// selection -- so pairing changes what is on screen without giving any of them a
// second representation to understand.
function splitRows(lines) {
  const rows = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.kind === "context" || (!line.old && !line.new)) {
      // A line on neither side -- git's "\ No newline at end of file" -- is
      // shown once, on the left, rather than doubled.
      const both = line.kind === "context" && line.old && line.new;
      rows.push({ left: i, right: both ? i : null });
      i++;
      continue;
    }

    const dels = [];
    while (i < lines.length && lines[i].kind === "del") dels.push(i++);
    const adds = [];
    while (i < lines.length && lines[i].kind === "add") adds.push(i++);

    for (let k = 0; k < Math.max(dels.length, adds.length); k++) {
      rows.push({
        left: k < dels.length ? dels[k] : null,
        right: k < adds.length ? adds[k] : null,
      });
    }
  }
  return rows;
}

// sideCell builds one side of a split row: line number, comment gutter, marker
// and code. A null index is the blank half of an unpaired edit.
function sideCell(file, hunk, lines, index, side, hl, threads, form, tr) {
  const ln = document.createElement("td");
  ln.className = "ln";
  const act = document.createElement("td");
  act.className = "act";
  const sign = document.createElement("td");
  sign.className = "sign";
  const code = document.createElement("td");
  code.className = "code";

  if (index === null) {
    // Filler, not a line: it must not be numbered, commented, or offered a
    // pencil, and it is tinted so the eye reads it as "nothing here".
    for (const cell of [ln, act, sign, code]) cell.classList.add("void");
    return [ln, act, sign, code];
  }

  const line = lines[index];
  const number = side === "left" ? line.old : line.new;
  ln.textContent = number ? number : "";
  act.textContent = "✎";
  act.title = "Comment on this line — drag to cover several";

  const [marker, text] = splitMarker(line.content);
  sign.textContent = marker;
  const painted = hl && hl[index];
  if (painted) {
    code.classList.add("hl");
    code.innerHTML = painted;
  } else {
    code.textContent = text;
  }

  const tone = line.kind === "add" ? "add" : line.kind === "del" ? "del" : "";
  if (tone) {
    for (const cell of [sign, code]) cell.classList.add(tone);
  }
  if (line.expanded) ln.classList.add("expanded");

  // The margin bar goes on the outermost cell of the side the comment is on, so
  // a comment on a removed line marks the left and one on its replacement marks
  // the right.
  const covering = threads.filter((t) => t.side === (side === "left" ? "old" : "new") && coversLine(t, line));
  if (covering.length) {
    ln.classList.add("commented");
    if (covering.every((t) => t.resolved)) ln.classList.add("mark-done");
  }
  if (form && form.side === (side === "left" ? "old" : "new") && formCovers(form, file, line)) {
    ln.classList.add("pending");
  }

  // Dragging is per side: a range that started on the left is about removed
  // lines, and the two sides have different line numbers entirely.
  act.dataset.i = index;
  act.dataset.side = side;
  act.addEventListener("mousedown", (e) => {
    e.preventDefault();
    armDrag(file, hunk, lines, index, side);
  });
  tr.dataset[side] = index;
  return [ln, act, sign, code];
}

// rowsTableSplit renders a hunk side by side.
//
// Comment cards and the draft form still span the whole width. A comment is
// about a place in the code, not about a column, and a card confined to one half
// would be a third of the width of the same card in unified view.
function rowsTableSplit(file, hunk, hunkIdx, lines, threads, at, hl) {
  const table = document.createElement("table");
  table.className = "rows split";
  // The colgroup is what makes the halves equal: the gutters are pinned and the
  // two code columns are left unsized, so fixed layout splits the rest evenly.
  table.innerHTML =
    '<colgroup>' +
    '<col class="gutter"><col class="pencil"><col class="marker"><col>' +
    '<col class="gutter"><col class="pencil"><col class="marker"><col>' +
    "</colgroup>";
  const body = document.createElement("tbody");
  const form = state.form && state.form.path === file.path ? state.form : null;

  for (const row of splitRows(lines)) {
    const tr = document.createElement("tr");
    tr.className = "row";
    // Indices are per hunk, so the hunk has to travel with them: without it a
    // drag in one hunk would highlight the same index in every other. And the
    // path with it, since a `@@` header is only unique within one file.
    tr.dataset.hunk = hunk.header;
    tr.dataset.file = file.path;
    body.appendChild(tr);
    tr.append(
      ...sideCell(file, hunk, lines, row.left, "left", hl, threads, form, tr),
      ...sideCell(file, hunk, lines, row.right, "right", hl, threads, form, tr),
    );

    // A card renders under the row carrying the last line of its range, on
    // whichever side that line lives.
    for (const t of threads) {
      const spot = at.get(t.id);
      if (!spot || spot.hunk !== hunkIdx) continue;
      const index = t.side === "old" ? row.left : row.right;
      if (index === null || index === undefined) continue;
      const line = lines[index];
      const number = t.side === "old" ? line.old : line.new;
      if (number && number === spot.line) body.appendChild(threadRow(t));
    }
    if (form) {
      const index = form.side === "old" ? row.left : row.right;
      if (index !== null && index !== undefined) {
        const line = lines[index];
        const number = form.side === "old" ? line.old : line.new;
        if (number && number === form.end) body.appendChild(formRow(form));
      }
    }
  }

  table.appendChild(body);
  return table;
}

function wrapRow(node) {
  const tr = document.createElement("tr");
  const td = document.createElement("td");
  td.className = "thread-cell";
  // Five columns unified, eight split. A card is about a place in the code, not
  // about a column, so it spans the row either way.
  td.colSpan = state.split ? 8 : 5;
  td.appendChild(node);
  tr.appendChild(td);
  return tr;
}

function threadRow(t) { return wrapRow(threadCard(t)); }

function threadCard(t) {
  const card = document.createElement("div");
  card.className = "card" + (t.resolved ? " resolved" : "") + (t.sent ? "" : " draft");
  const collapsed = isCollapsed(t);
  if (collapsed) card.classList.add("collapsed");

  const range = t.endLine > t.startLine ? t.startLine + "\u2013" + t.endLine : String(t.startLine);
  const replies = t.replies || [];

  // The header is the toggle. It stays readable collapsed, so a shut card still
  // says who wrote it, where, whether it was sent, and whether the agent answered.
  const head = document.createElement("button");
  head.type = "button";
  head.className = "who toggle";
  head.setAttribute("aria-expanded", String(!collapsed));
  // A resolved thread wears one pill. How many times it was discussed and
  // whether the agent was told are both answers to "what is left to do here",
  // and the answer is nothing -- so they go, and resolved is what is left to
  // read. Draft stays even when resolved: a comment closed without ever being
  // sent is worth knowing about, which "sent" is not.
  const pills = t.resolved
    ? '<span class="pill done">resolved</span>' +
      (t.sent ? "" : '<span class="pill state">draft</span>')
    : (t.sent ? '<span class="pill state">sent</span>' : '<span class="pill state">draft</span>') +
      (replies.length
        ? '<span class="pill ' + (replies[replies.length - 1].author === "agent" ? "agent" : "state") + '">' +
          replies.length + (replies.length === 1 ? " reply" : " replies") + "</span>"
        : "");

  head.innerHTML =
    '<span class="chev">' + (collapsed ? "\u25b8" : "\u25be") + "</span>" +
    '<span class="pill user">you</span>' +
    '<span class="anchor">' + esc(t.path) + ":" + range + "</span>" +
    pills +
    (collapsed ? '<span class="preview">' + esc(oneLine(t.body)) + "</span>" : "");
  head.onclick = () => toggleThread(t);
  card.appendChild(head);

  if (collapsed) return card;

  const body = document.createElement("div");
  let html = "";
  if (t.quote && t.quote.length) {
    html += '<div class="form-meta">' + t.quote.map(esc).join("<br>") + "</div>";
  }
  html += '<div class="body">' + esc(t.body) + "</div>";
  for (const r of replies) {
    html += '<div class="reply"><div class="who"><span class="pill ' +
      (r.author === "agent" ? "agent" : "user") + '">' +
      (r.author === "agent" ? agentName().toLowerCase() : "you") + "</span></div>" +
      '<div class="body">' + esc(r.body) + "</div></div>";
  }
  body.innerHTML = html;
  card.appendChild(body);

  const acts = document.createElement("div");
  acts.className = "acts";
  if (!t.sent) {
    acts.appendChild(button("Delete", "btn small ghost", async () => {
      await post("/delete", { thread: t.id });
    }));
  }
  acts.appendChild(button(t.resolved ? "Reopen" : "Resolve", "btn small ghost", async () => {
    await post("/resolve", { thread: t.id, resolved: !t.resolved });
  }));
  acts.appendChild(button("Reply", "btn small ghost", () => {
    if (state.replies[t.id] === undefined) state.replies[t.id] = "";
    state.focusKey = "reply:" + t.id;
    render();
  }));
  card.appendChild(acts);

  // Rendered from state rather than appended on click, so a repaint mid-sentence
  // rebuilds the box with what was in it instead of throwing it away.
  if (state.replies[t.id] !== undefined) card.appendChild(replyBox(t));
  return card;
}

function replyBox(t) {
  const wrap = document.createElement("div");
  wrap.className = "reply";

  const ta = document.createElement("textarea");
  ta.placeholder = "Add a note to this thread";
  ta.dataset.typing = "reply:" + t.id;
  ta.value = state.replies[t.id] || "";
  ta.oninput = () => { state.replies[t.id] = ta.value; };

  const send = button("Add reply", "btn small primary", async () => {
    const text = (state.replies[t.id] || "").trim();
    if (!text) { ta.focus(); return; }
    const res = await post("/reply", { thread: t.id, body: text, author: "user" });
    if (!res.ok) { toast("Could not add that reply."); return; }
    delete state.replies[t.id];
    // A reply is one more thing the agent has to be told, so under auto-send it
    // leaves now and says so -- the same feedback a new comment gives.
    const data = await res.json();
    if (data.threads) state.threads = data.threads;
    render();
    if (data.error) { toast(data.error); }
    else if (data.sending) { toast("Sent to " + agentName() + "."); }
  });
  const cancel = button("Cancel", "btn small ghost", () => {
    delete state.replies[t.id];
    render();
  });

  wrap.append(ta, send, cancel);
  return wrap;
}

// oneLine flattens a body for the collapsed preview.
function oneLine(text) {
  const flat = String(text || "").replace(/\s+/g, " ").trim();
  return flat.length > 90 ? flat.slice(0, 89) + "\u2026" : flat;
}

function button(label, cls, onclick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = cls;
  b.textContent = label;
  b.onclick = onclick;
  return b;
}

function formRow(form) { return wrapRow(formCard(form)); }

function formCard(form) {
  const card = document.createElement("div");
  card.className = "card draft";
  const range = form.end > form.start ? form.start + "–" + form.end : String(form.start);
  card.innerHTML = '<div class="who"><span class="pill user">new comment</span>' +
    '<span class="anchor">' + esc(form.path) + ":" + range +
    (form.side === "old" ? " (removed)" : "") + "</span></div>" +
    '<div class="form-meta">' + form.quote.map(esc).join("<br>") + "</div>";

  const ta = document.createElement("textarea");
  ta.placeholder = "What should " + agentName() + " change here?";
  // The text lives on the form, not in the element: this card is rebuilt on
  // every repaint, and an agent editing the file is what triggers most of them.
  ta.dataset.typing = "form";
  ta.value = form.draft || "";
  ta.oninput = () => { form.draft = ta.value; };
  const acts = document.createElement("div");
  acts.className = "acts";
  acts.append(
    button("Add comment", "btn small primary", async () => {
      const body = (form.draft || "").trim();
      if (!body) { ta.focus(); return; }
      // submit rides along with the comment rather than following it as a
      // second request: one round trip, and no window in which the comment
      // exists as a draft that a reload could present as unsent.
      const res = await post("/comments", {
        submit: state.autoSend,
        comments: [{
          path: form.path, side: form.side, startLine: form.start,
          endLine: form.end, quote: form.quote, body: body,
        }],
      });
      if (!res.ok) { toast("Could not save that comment."); return; }
      const data = await res.json();
      state.threads = data.threads || state.threads;
      state.form = null;
      render();
      if (data.error) { toast(data.error); }
      else if (data.sending) { toast("Sent to " + agentName() + "."); }
    }),
    button("Cancel", "btn small ghost", () => { state.form = null; render(); }),
  );
  card.append(ta, acts);
  return card;
}

// renderBar shows the queue, and there is no queue under auto-send.
//
// The bar is hidden outright rather than shown with its buttons removed: a bar
// reporting comments with no way to act on them is worse than no bar. Which is
// also why turning the mode on flushes whatever was already queued -- with
// nothing left to press, anything still pending would be stranded. If a flush
// fails (no agent tab), the error is toasted and turning the mode back off
// brings the bar, and those comments, straight back.
// pendingCount counts everything waiting to be sent, of both kinds.
//
// A reply on a thread the agent already has is pending work in its own right:
// counting only unsent threads left the bar hidden while a reply sat queued,
// with nothing on screen saying so and no button to send it.
function pendingCount() {
  let n = 0;
  for (const t of state.threads) {
    if (!t.sent) { n++; continue; }
    for (const r of t.replies || []) {
      if (r.author === "user" && !r.sent) n++;
    }
  }
  return n;
}

function renderBar() {
  const n = pendingCount();
  const bar = $("bar");
  if (!n || state.autoSend) { bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  $("barcount").textContent = n + (n === 1 ? " comment ready" : " comments ready");
  $("barhint").textContent = "Comments and replies are queued here until you submit them.";
}

/* ---------------- range selection ---------------- */

// The range follows the pointer for as long as the button is down, wherever it
// happens to be -- over the code, over a comment card, outside the table.
document.addEventListener("mousemove", (e) => {
  if (state.dragging) extendPick(e.clientY);
});

// The range is committed on mouseup anywhere, not just on the gutter: a drag
// that leaves the table would otherwise stay armed and pick up the next click.
document.addEventListener("mouseup", () => {
  if (!state.dragging) return;
  state.dragging = false;
  const pick = state.picking;
  state.picking = null;
  if (!pick) { render(); return; }

  const lo = Math.min(pick.from, pick.to), hi = Math.max(pick.from, pick.to);
  const rows = pick.lines.slice(lo, hi + 1);

  // Prefer the post-image: it is the code that exists now, and what an agent
  // can go and edit. A range made up only of deletions has no post-image, and
  // must be reported against the old side or it names nothing at all.
  const news = rows.map((r) => r.new).filter((n) => n > 0);
  const olds = rows.map((r) => r.old).filter((n) => n > 0);
  let side, start, end;
  if (news.length) { side = "new"; start = Math.min(...news); end = Math.max(...news); }
  else if (olds.length) { side = "old"; start = Math.min(...olds); end = Math.max(...olds); }
  else { render(); return; }

  state.form = {
    path: pick.path, side: side, start: start, end: end,
    quote: rows.map((r) => r.content),
    draft: "",
  };
  state.focusKey = "form";
  render();
});

/* ---------------- wiring ---------------- */

$("banner-close").onclick = () => {
  state.bannerDismissed = true;
  $("banner").classList.add("hidden");
};
// Scrolling has to do two things: say which file is in view, and build the ones
// coming into it. Both are cheap enough to run on a frame, and both are wrong if
// they wait for the next poll -- an unbuilt file two screens down is blank by
// the time a fast scroll reaches it.
$("diff").addEventListener("scroll", () => {
  if (scrollPending) return;
  scrollPending = true;
  requestAnimationFrame(() => {
    scrollPending = false;
    spyScroll();
    mountVisible();
  });
}, { passive: true });

let scrollPending = false;

// mountVisible builds and discards file bodies as they come and go, without
// touching the ones already in the right state.
function mountVisible() {
  if (!state.snapshot) return;
  const pane = $("diff");
  for (const file of orderedFiles()) {
    const section = state.sections[file.path];
    if (!section) continue;
    if (nearViewport(pane, section.el)) mountSection(section, file);
    else unmountSection(section);
  }
}

$("theme").onclick = (e) => {
  const btn = e.target.closest("button[data-theme]");
  if (btn) setTheme(btn.dataset.theme);
};
// A system change is only interesting while no explicit choice is in force, and
// then only to keep the buttons honest about which theme is actually showing.
try {
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (!state.theme) renderTheme();
  });
} catch (err) { /* an older browser simply will not follow the OS live */ }

$("view").onclick = async (e) => {
  const btn = e.target.closest("button[data-split]");
  if (!btn) return;
  const want = btn.dataset.split === "1";
  if (want === state.split) return;
  // Painted before the round trip: the layout is the page's own and waiting on
  // the server to agree would make the toggle feel broken.
  state.split = want;
  render();
  const res = await post("/view", { split: want });
  if (!res.ok) { toast("Could not change the view."); return; }
  const data = await res.json();
  state.split = !!data.split;
  render();
};
$("autosend").onchange = (e) => setAutoSend(e.target.checked);
$("refresh").onclick = () => load(state.scope, true);
$("scope").onclick = (e) => {
  const btn = e.target.closest("button[data-scope]");
  if (!btn) return;
  state.scope = btn.dataset.scope;
  load(state.scope, false);
};
$("submit").onclick = async () => {
  const btn = $("submit");
  btn.disabled = true;
  try {
    const res = await post("/comments", { comments: [], submit: true });
    const data = await res.json();
    if (data.error) { toast(data.error); return; }
    state.threads = data.threads || state.threads;
    render();
    const agent = (state.snapshot && state.snapshot.agent) || {};
    toast(agent.canReply
      ? "Sent to " + agentName() + " — it will reply under each comment as it works."
      : "Sent to " + agentName() + " — it cannot reply from this session, so watch the diff for changes.");
  } catch (err) {
    toast("Could not submit: " + err);
  } finally {
    btn.disabled = false;
  }
};
// Discard drops unsent comments. A queued reply is deliberately left alone: it
// hangs off a thread the agent already has, so there is nothing to delete
// without taking that thread's history with it, and the reader can submit it or
// leave it.
$("discard").onclick = async () => {
  for (const t of state.threads.filter((x) => !x.sent)) {
    await post("/delete", { thread: t.id });
  }
};

function esc(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

loadExpansion();
load(null, false).then(connect);
</script>
