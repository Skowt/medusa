<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review changes</title>
<style>
  /* Light is the base, dark is an override, and there are three ways to reach it:
     the OS setting when the reader has expressed no preference, and the
     data-theme attribute when they have. The media query is guarded against
     data-theme="light" so an explicit choice beats the system on a dark machine
     -- without that guard the toggle could turn dark on but never off.

     The dark block is written twice, and has to be: a media query and an
     attribute selector cannot be combined into one rule. Keeping every colour
     the page uses in these blocks -- syntax tokens included, which used to be
     literals in a dozen .hljs rules -- is what keeps the duplication to one list
     instead of two palettes and a rule set. Change one, change both. */
  :root {
    color-scheme: light;
    --bg: #fbfbfa; --panel: #fff; --ink: #1a1a19; --muted: #6b6b66;
    --line: #e4e4e0; --accent: #b4592a; --shadow: 0 1px 2px rgba(0,0,0,.06);
    --add-bg: #e6ffec; --add-ink: #04531f; --del-bg: #ffebe9; --del-ink: #7d1a12;
    --gutter: #f6f6f4; --sel: #fff4d6; --ok: #1f7a3d; --warn: #9a6400;
    --tok-comment: #6e7781; --tok-keyword: #cf222e; --tok-string: #0a3069;
    --tok-number: #0550ae; --tok-title: #8250df; --tok-variable: #953800;
    --tok-meta: #116329;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #17171a; --panel: #1f1f23; --ink: #ececee; --muted: #9a9aa2;
      --line: #303036; --accent: #e07a4a; --shadow: 0 1px 2px rgba(0,0,0,.4);
      --add-bg: #12261a; --add-ink: #7ee2a8; --del-bg: #2b1618; --del-ink: #ffa7a0;
      --gutter: #1a1a1e; --sel: #33290e; --ok: #7ee2a8; --warn: #e0b45a;
      --tok-comment: #8b949e; --tok-keyword: #ff7b72; --tok-string: #a5d6ff;
      --tok-number: #79c0ff; --tok-title: #d2a8ff; --tok-variable: #ffa657;
      --tok-meta: #7ee787;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17171a; --panel: #1f1f23; --ink: #ececee; --muted: #9a9aa2;
    --line: #303036; --accent: #e07a4a; --shadow: 0 1px 2px rgba(0,0,0,.4);
    --add-bg: #12261a; --add-ink: #7ee2a8; --del-bg: #2b1618; --del-ink: #ffa7a0;
    --gutter: #1a1a1e; --sel: #33290e; --ok: #7ee2a8; --warn: #e0b45a;
    --tok-comment: #8b949e; --tok-keyword: #ff7b72; --tok-string: #a5d6ff;
    --tok-number: #79c0ff; --tok-title: #d2a8ff; --tok-variable: #ffa657;
    --tok-meta: #7ee787;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; cursor: pointer; }

  /* ---- header ---- */
  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
  .branch {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .branch b { color: var(--accent); font-weight: 600; }
  /* The base commit is the identity of what is being compared against, so it is
     inked like the branch; the subject is context and recedes. */
  .branch .rev { color: var(--ink); }
  .branch .subject { opacity: .75; }
  .spacer { margin-left: auto; }
  .tabs { display: inline-flex; background: var(--bg); border: 1px solid var(--line);
          border-radius: 8px; padding: 2px; }
  .tabs button { border: 0; background: transparent; color: var(--muted);
                 font-weight: 550; padding: 5px 12px; border-radius: 6px; font-size: 13px;
                 white-space: nowrap; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
  /* Glyph-only, so the header does not become a third row of words. Padding is
     tightened because a single character does not need a word's worth of it. */
  #theme button { padding: 5px 8px; font-size: 13px; line-height: 1.15; }
  /* A real checkbox, not a styled div: this decides where the reader's comments
     go, so it has to read as a control and be reachable by keyboard. */
  .mode { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
          color: var(--muted); white-space: nowrap; cursor: pointer; }
  .mode input { accent-color: var(--accent); margin: 0; cursor: pointer; }
  .mode.on { color: var(--accent); font-weight: 600; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--del-ink); }
  .btn {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 8px; padding: 6px 12px; font-weight: 550; font-size: 13px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn.small { padding: 3px 9px; font-size: 12px; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--line); }

  /* ---- reply-unavailable banner ---- */
  /* Warning-toned rather than error-toned: nothing has failed, and the review
     itself works. Only the reply channel is missing. */
  .banner {
    flex: 0 0 auto; display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); border-left: 3px solid var(--warn);
    font-size: 13px;
  }
  .banner.hidden { display: none; }
  .banner-body { flex: 1 1 auto; min-width: 0; }
  .banner strong { color: var(--warn); }
  .banner pre {
    margin: 8px 0 0; padding: 8px 10px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    white-space: pre-wrap; overflow-x: auto;
  }
  .banner pre:empty { display: none; }

  /* ---- shell ---- */
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  nav {
    flex: 0 0 300px; min-width: 200px; max-width: 46vw; overflow-y: auto;
    border-right: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column;
  }
  .nav-head { padding: 10px 14px; font-size: 11px; text-transform: uppercase;
              letter-spacing: .06em; color: var(--muted); font-weight: 600;
              border-bottom: 1px solid var(--line); }
  .files { list-style: none; margin: 0; padding: 6px; }
  .files li { border-radius: 7px; }
  .files button {
    width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink);
    padding: 5px 9px; border-radius: 7px; display: flex; gap: 6px; align-items: baseline;
  }
  .files button:hover { background: var(--bg); }
  .files li.sel > button { background: var(--accent); color: #fff; }
  .files li.sel .stat, .files li.sel .count { color: rgba(255,255,255,.82); }
  /* A directory is scaffolding, not a thing to review, so it is quieter than
     the files under it. The twisty column is reserved on file rows too: without
     it every file sits half a glyph left of its own folder. */
  .files li.dir > button { color: var(--muted); font-weight: 600; }
  .tw { flex: 0 0 auto; width: 12px; font-size: 10px; line-height: 1.5; color: var(--muted); }
  .files li.sel .tw { color: rgba(255,255,255,.82); }
  .fname { flex: 1 1 auto; min-width: 0; font-size: 13px; }
  .fname .base { display: block; word-break: break-all; }
  .stat { font-family: ui-monospace, Menlo, monospace; font-size: 11px; white-space: nowrap; }
  .stat .a { color: var(--ok); } .stat .d { color: var(--del-ink); }
  .badge { background: var(--accent); color: #fff; border-radius: 999px;
           font-size: 10px; padding: 1px 6px; font-weight: 650; }
  /* The unread dot is the agent's colour, the same one its replies carry in a
     card, because that is what it means: the agent has said something here and
     nobody has looked. It is deliberately not a count -- how many things it
     said is not the question being asked of a file you have not opened. */
  .badge.new { background: var(--ok); color: var(--ok); font-size: 8px;
               padding: 1px 5px; line-height: 1.4; }
  .files li.sel .badge { background: rgba(255,255,255,.28); }
  /* A viewed file is dimmed as well as ticked. The tick alone is easy to miss
     when it sits in a column of forty rows; a whole row that has receded is
     what makes the remaining work stand out. */
  .files li.seen > button .fname { opacity: .55; }
  .files li.seen .tw { color: var(--ok); opacity: 1; }
  .files li.sel.seen > button .fname { opacity: .8; }

  /* ---- diff ---- */
  section.diff { flex: 1 1 auto; overflow-y: auto; padding: 0 0 120px; }
  /* Each file is its own block, and its header sticks only while that block is
     on screen: sticky is bounded by its containing block, so one header hands
     over to the next as the reader scrolls past rather than piling up. */
  section.file { position: relative; }
  section.file + section.file { border-top: 1px solid var(--line); }
  .file-head {
    position: sticky; top: 0; z-index: 3; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 10px 16px;
    display: flex; align-items: center; gap: 10px;
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
  }
  .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
         border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted);
         font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; }
  .hunk-head {
    background: var(--gutter); color: var(--muted); border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line); padding: 3px 12px;
    font-family: ui-monospace, Menlo, monospace; font-size: 11.5px;
    display: flex; align-items: center; gap: 10px;
  }
  /* The foot bar carries no label, so its border sits on the other side: it
     closes the rows above it rather than introducing the ones below. */
  .hunk-head.foot { border-top: 0; }
  .hunk-acts { display: inline-flex; gap: 2px; flex: 0 0 auto; }
  .hunk-acts button {
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    border-radius: 5px; padding: 0 6px; font-size: 9px; line-height: 16px;
  }
  .hunk-acts button:hover { color: var(--accent); border-color: var(--accent); }
  /* An expanded line is context the reader asked for, not part of the change.
     Numbering it like any other context row is the point -- a comment can be
     left on it -- so the only distinction is that it is not tinted. */
  tr.expanded td.ln { color: var(--muted); opacity: .75; }
  table.rows { width: 100%; border-collapse: collapse;
               font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  table.rows td { padding: 0; vertical-align: top; }
  td.ln {
    /* 1ch is one digit in a monospace font, plus the cell's own padding. The
       46px floor keeps a short file's gutter from looking cramped. */
    width: 1%; min-width: max(46px, calc(var(--ln-ch, 3) * 1ch + 14px));
    text-align: right; padding: 1px 8px 1px 6px;
    color: var(--muted); background: var(--gutter); user-select: none;
    border-right: 1px solid var(--line); font-size: 11.5px;
  }
  td.act {
    width: 22px; background: var(--gutter); border-right: 1px solid var(--line);
    user-select: none; text-align: center; color: transparent;
    font-weight: 700; cursor: pointer;
  }
  tr.row:hover td.act { color: var(--accent); background: var(--bg); }
  /* The +/- lives in its own column. Left as the first character of the code
     cell it reads as part of the line's text, which is exactly how a reviewer
     comes to believe an added line starts with a plus sign. */
  td.sign {
    width: 1%; min-width: 16px; padding: 1px 0 1px 6px; text-align: left;
    user-select: none; font-weight: 700;
  }
  td.code { padding: 1px 12px 1px 6px; white-space: pre-wrap; word-break: break-word; }
  tr.add td.code, tr.add td.sign { background: var(--add-bg); color: var(--add-ink); }
  tr.del td.code, tr.del td.sign { background: var(--del-bg); color: var(--del-ink); }
  tr.picked td.code, tr.picked td.sign { background: var(--sel) !important; }
  tr.picked td.ln, tr.picked td.act { background: var(--sel); }
  /* The bar in the left margin marks every line a comment covers, so a card is
     visibly attached to the code it is about rather than floating near it. It
     runs down the outermost column, clear of the hover pencil in the gutter. */
  tr.commented td.ln:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  tr.commented.mark-done td.ln:first-child { box-shadow: inset 3px 0 0 var(--ok); }
  tr.pending td.ln:first-child { box-shadow: inset 3px 0 0 var(--warn); }

  /* ---- split view ---- */
  /* Fixed layout, and the two code columns are left unsized on purpose: under
     `table-layout: fixed` the columns with no width share what is left equally,
     which is the only way to get halves that stay equal. Asked for 50% under the
     default auto layout they came out 551px and 508px, because auto layout
     treats a width as a hint and gives the wider content more -- so the two
     sides of the same change wrapped at different points. */
  table.rows.split { table-layout: fixed; }
  table.rows.split col.gutter { width: max(46px, calc(var(--ln-ch, 3) * 1ch + 14px)); }
  table.rows.split col.pencil { width: 22px; }
  table.rows.split col.marker { width: 16px; }
  /* A visible seam down the middle. Without it, a long line on the left runs
     straight into the right-hand gutter and the two halves stop reading as two. */
  table.rows.split td.ln:nth-child(5) { border-left: 2px solid var(--line); }
  /* In split view the tint goes on the cells rather than the row: the two sides
     of one row are usually a removal and its replacement, so a row-level colour
     could only ever be right about one of them. */
  table.rows.split td.sign.add, table.rows.split td.code.add {
    background: var(--add-bg); color: var(--add-ink);
  }
  table.rows.split td.sign.del, table.rows.split td.code.del {
    background: var(--del-bg); color: var(--del-ink);
  }
  table.rows.split td.code.add.hl, table.rows.split td.code.del.hl { color: var(--ink); }
  /* The blank half of an unpaired edit. Striped rather than empty, so it reads
     as "nothing on this side" and not as a line that happens to be blank. */
  table.rows.split td.void {
    background: repeating-linear-gradient(45deg,
      transparent, transparent 5px, var(--gutter) 5px, var(--gutter) 10px);
    cursor: default; color: transparent;
  }
  table.rows.split td.act.void { color: transparent !important; }
  table.rows.split tr.row:hover td.act.void { color: transparent; }
  table.rows.split td.ln.expanded { color: var(--muted); opacity: .75; }
  /* Picked, commented and pending all mark one side in split view. */
  tr.picked-left td:nth-child(-n+4), tr.picked-right td:nth-child(n+5) {
    background: var(--sel) !important;
  }
  table.rows.split td.ln.commented { box-shadow: inset 3px 0 0 var(--accent); }
  table.rows.split td.ln.commented.mark-done { box-shadow: inset 3px 0 0 var(--ok); }
  table.rows.split td.ln.pending { box-shadow: inset 3px 0 0 var(--warn); }
  /* Syntax colours. The values are GitHub's, because those are the ones proven
     legible on exactly these three backgrounds -- panel, the added tint and the
     removed tint -- which a palette picked against white alone is not. They live
     in the token blocks above so that one theme switch moves everything, and so
     that these rules exist once rather than once per theme.

     No italics: this is a monospace table, and a slanted comment run changes the
     glyph advance just enough to make columns of code stop lining up. */
  .hljs-comment, .hljs-quote { color: var(--tok-comment); }
  .hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-selector-tag,
  .hljs-doctag, .hljs-deletion { color: var(--tok-keyword); }
  .hljs-string, .hljs-regexp, .hljs-subst, .hljs-addition,
  .hljs-attr, .hljs-selector-attr, .hljs-selector-pseudo { color: var(--tok-string); }
  .hljs-number, .hljs-bullet, .hljs-link { color: var(--tok-number); }
  .hljs-title, .hljs-name, .hljs-section, .hljs-tag, .hljs-class,
  .hljs-type, .hljs-attribute, .hljs-selector-class, .hljs-selector-id { color: var(--tok-title); }
  .hljs-variable, .hljs-template-variable, .hljs-symbol, .hljs-params { color: var(--tok-variable); }
  .hljs-meta { color: var(--tok-meta); }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 700; }
  /* A highlighted add/del row drops its green or red ink: with tokens coloured,
     the text that is *not* a token would be the only green left on the line, and
     the row reads as a jumble. The background tint and the sign column still say
     which side it is. */
  tr.add td.code.hl, tr.del td.code.hl { color: var(--ink); }
  .empty { padding: 40px 20px; color: var(--muted); text-align: center; }
  .note { padding: 10px 16px; color: var(--muted); font-size: 13px; }

  /* ---- comments ---- */
  .thread-cell { padding: 8px 12px 8px 68px !important; background: var(--bg); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 10px 12px; margin: 6px 0; max-width: 760px;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px;
    box-shadow: var(--shadow);
  }
  .card.resolved { border-left-color: var(--ok); opacity: .72; }
  .card.draft { border-left-style: dashed; }
  .who { display: flex; align-items: center; gap: 8px; margin-bottom: 5px;
         font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
         color: var(--muted); font-weight: 650; }
  /* The header doubles as the collapse toggle, so it is a real button — it has
     to be reachable by keyboard, which a click handler on a div is not. */
  button.toggle {
    width: 100%; border: 0; background: transparent; padding: 0; margin-bottom: 5px;
    text-align: left; font: inherit; font-size: 11px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); font-weight: 650; cursor: pointer;
  }
  /* Contains the row: the anchor no longer shrinks, so on a very narrow card the
     line could otherwise spill past the card's own edge. */
  button.toggle { overflow: hidden; }
  button.toggle:hover { color: var(--ink); }
  .card.collapsed button.toggle { margin-bottom: 0; }
  .chev { font-size: 10px; width: 10px; flex: 0 0 auto; }
  /* The preview only exists collapsed, and must not widen the card: min-width 0
     is what lets a flex child actually shrink enough to ellipsize. */
  /* Shrink factor 100, so the preview surrenders its width before the anchor
     gives up a single character: the preview is a convenience and the anchor is
     the answer to "where", and a header clipped to "helpers..." with the line
     range cut off has lost the more useful half. */
  .preview {
    flex: 1 100 auto; min-width: 0; text-transform: none; letter-spacing: 0;
    font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* A card header is one line, always. Everything in it is either fixed-size or
     ellipsizes: a pill allowed to wrap broke "1 reply" across two lines and made
     a shut card taller than an open one's first line, and the anchor did the
     same by splitting a line range down the middle. */
  .who { flex-wrap: nowrap; }
  .who .pill { border-radius: 999px; padding: 1px 8px; font-size: 10px;
               flex: 0 0 auto; white-space: nowrap; }
  /* The anchor may shrink, but only ever to an ellipsis. It shares the slack
     with the preview, which is far longer and so gives way first. */
  /* The anchor does not shrink at all. Allowed to, it ellipsized a line range
     that fitted perfectly: the header is letter-spaced, so the last glyph
     carries a fraction of trailing space, the content measured a sub-pixel over
     an integer box, and text-overflow duly cut the ":31-48" off the end. The
     preview absorbs the slack instead, and max-width keeps a pathological path
     inside the card, where it can ellipsize honestly. */
  .anchor { flex: 0 0 auto; max-width: 100%; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; }
  .pill.user { background: var(--accent); color: #fff; }
  .pill.agent { background: var(--ok); color: var(--panel); }
  .pill.state { border: 1px solid var(--line); color: var(--muted); }
  /* Resolved is the headline on a finished thread, so it is filled rather than
     outlined -- the reply count it replaces was the loudest thing on the row. */
  .pill.done { background: var(--ok); color: var(--panel); }
  .body { white-space: pre-wrap; word-break: break-word; }
  .reply { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; }
  .card .acts { display: flex; gap: 6px; margin-top: 8px; }
  textarea {
    width: 100%; min-height: 76px; resize: vertical; font: inherit;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .form-meta { font-size: 11.5px; color: var(--muted); margin-bottom: 6px;
               font-family: ui-monospace, Menlo, monospace; }

  /* ---- submit bar ---- */
  .bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 6;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--line);
    box-shadow: 0 -2px 10px rgba(0,0,0,.10);
  }
  .bar.hidden { display: none; }
  .bar .count { font-weight: 650; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 74px; z-index: 9;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 9px 14px; box-shadow: var(--shadow); font-size: 13px;
    max-width: 70vw;
  }
  .toast.hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1 id="ws">Review changes</h1>
  <span class="branch" id="branch"></span>
  <span class="spacer"></span>
  <div class="tabs" role="tablist" id="theme">
    <button role="tab" data-theme="light" aria-selected="false" title="Light theme" aria-label="Light theme">&#9788;</button>
    <button role="tab" data-theme="dark" aria-selected="false" title="Dark theme" aria-label="Dark theme">&#9790;</button>
  </div>
  <label class="mode" id="modelabel" title="Send each comment to the agent as you write it, instead of queueing until Submit">
    <input type="checkbox" id="autosend"><span id="modetext">Send as I comment</span>
  </label>
  <div class="tabs" role="tablist" id="view">
    <button role="tab" data-split="0" aria-selected="true" title="One column, changes in sequence">Unified</button>
    <button role="tab" data-split="1" aria-selected="false" title="Two columns, before and after">Split</button>
  </div>
  <div class="tabs" role="tablist" id="scope">
    <button role="tab" data-scope="working" aria-selected="true">Uncommitted</button>
    <button role="tab" data-scope="branch" aria-selected="false">Since base</button>
  </div>
  <span class="live"><span class="dot" id="dot"></span><span id="livetext">connecting</span></span>
  <button class="btn" id="refresh">Refresh</button>
</header>

<div class="banner hidden" id="banner">
  <div class="banner-body">
    <strong id="banner-title"></strong>
    <span id="banner-text"></span>
    <pre id="banner-fix"></pre>
  </div>
  <button class="btn small ghost" id="banner-close" title="Dismiss">&times;</button>
</div>

<main>
  <nav>
    <div class="nav-head" id="navhead">Files</div>
    <ul class="files" id="filelist"></ul>
  </nav>
  <section class="diff" id="diff"></section>
</main>

<div class="bar hidden" id="bar">
  <span class="count" id="barcount"></span>
  <span class="branch" id="barhint">Comments are queued here until you submit them.</span>
  <span class="spacer"></span>
  <button class="btn" id="discard">Discard drafts</button>
  <button class="btn primary" id="submit">Submit review</button>
</div>
<div class="toast hidden" id="toast"></div>

<!-- Vendored, served from this session's own URL: see highlight.min.js.README
     for why it is not a CDN link. Blocking rather than deferred, so the first
     paint is already coloured; everything below guards on the global anyway, so
     a bundle that failed to load costs colour and nothing else. -->
<script src="highlight.js"></script>
<script>
"use strict";

// The session token is the last path segment of the page's own URL, so the page
// needs no server-side templating and no separate config request.
const API = location.pathname.replace(/\/$/, "") + "/api";

const state = {
  snapshot: null,
  threads: [],
  file: null,       // selected path
  scope: "working",
  picking: null,    // {path, anchor, from, to} while a range is being dragged
  form: null,       // {path, side, start, end, quote, draft}
  // Open reply boxes, keyed by thread id, holding what has been typed into
  // them. Both this and form.draft exist for one reason: the pane is rebuilt on
  // every poll, and a textarea whose text lives only in the DOM loses it.
  replies: {},
  // Which textarea to focus after the next render, when it is one that has just
  // been opened rather than one the reader is already in.
  focusKey: null,
  // Files with agent replies the reader has not seen, path -> Set of thread ids.
  // It is page state and nothing else: "have I read this" is a fact about the
  // person looking, not about the review, and a second tab is a second reader.
  unread: {},
  // Side-by-side rather than unified. Server-remembered, like the send mode: the
  // page is served from a fresh ephemeral port every restart, so the browser has
  // nowhere durable of its own to keep it.
  split: false,
  // "light", "dark", or "" to follow the OS -- which is what the page did before
  // there was a toggle, and still does until the reader picks one.
  theme: "",
  // One entry per file on the page: its element, its measured height, and
  // whether its rows are currently built. See renderDiff.
  sections: {},
  // Set while a click is scrolling to a file, so the scroll-spy does not fight
  // the scroll it caused.
  scrollingTo: null,
  landed: false,
  order: [],
  orderStamp: null,
  dragging: false,
  notice: null,     // last snapshot caveat shown, so it is not re-toasted every poll
  bannerDismissed: false,
  // Which directories are shut, keyed by path. Held in the page for the same
  // reason thread collapse is: the navigator is rebuilt on every poll, and a
  // state rebuilt from the snapshot would spring every folder open again.
  // Collapsed is the set, so a directory the page has never seen starts open --
  // a tree that hides the changes on first load defeats the point of it.
  dirsCollapsed: new Set(),
  // Files the server says are read. Resolved there, not here: a mark is pinned
  // to the digest of the diff it was made against, and the page has no business
  // holding that.
  viewed: new Set(),
  // How far the context has been opened around each hunk, keyed by
  // path + hunk index, alongside the file lines fetched to fill it. Both are
  // dropped for a file whose digest moves, since expanded context from a diff
  // that no longer exists would be showing lines the file does not have.
  expand: {},   // path -> hunk index -> {up, down}; see saveExpansion
  lineCache: {},
  lineTotal: {},
  hl: {},       // path -> "hunk:up:down" -> per-row HTML
  fileDigests: {},
  // Whether a comment goes to the agent the moment it is written. The server
  // owns it, so a reload or a second tab cannot leave the reader believing
  // comments were sent while they were quietly queueing.
  autoSend: false,
  // Collapse is remembered per thread id rather than as a flag on the thread,
  // because the diff repaints every couple of seconds and a flag rebuilt from
  // the server would snap every card back open under the reader's cursor.
  // Two sets, not one: the default depends on whether a thread is resolved, so
  // "no opinion" has to be distinguishable from "the reader collapsed this".
  expanded: new Set(),
  collapsed: new Set(),
};

// isCollapsed decides a card's state. A resolved thread starts collapsed — it is
// done, and the point of resolving is to get it out of the way — but an explicit
// choice always wins, so expanding one does not undo itself on the next poll.
function isCollapsed(t) {
  // A card being replied to is never collapsed, whatever else is true: the
  // reply box is inside it, and folding it away would hide text being typed.
  if (state.replies[t.id] !== undefined) return false;
  if (state.expanded.has(t.id)) return false;
  if (state.collapsed.has(t.id)) return true;
  return !!t.resolved;
}

function toggleThread(t) {
  if (isCollapsed(t)) {
    state.expanded.add(t.id);
    state.collapsed.delete(t.id);
  } else {
    state.collapsed.add(t.id);
    state.expanded.delete(t.id);
  }
  render();
}

const $ = (id) => document.getElementById(id);

/* ---------------- data ---------------- */

async function load(scope, refresh) {
  const q = new URLSearchParams();
  if (scope) q.set("scope", scope);
  if (refresh) q.set("refresh", "1");
  const res = await fetch(API + "/snapshot?" + q.toString());
  if (!res.ok) { toast("Could not read the diff (" + res.status + ")"); return; }
  const data = await res.json();
  apply(data.snapshot, data.threads, data.viewed, data.autoSend, data.split, data.theme);
}

function apply(snapshot, threads, viewed, autoSend, split, theme) {
  state.snapshot = snapshot;
  state.threads = threads || [];
  if (viewed !== undefined) state.viewed = new Set(viewed || []);
  if (autoSend !== undefined) state.autoSend = !!autoSend;
  if (split !== undefined) state.split = !!split;
  if (theme !== undefined) state.theme = theme || "";
  if (snapshot && snapshot.scope) state.scope = snapshot.scope;
  dropStaleContext(snapshot);
  // Keep the selection if that file still has changes; otherwise fall back to
  // the first file, so a file the agent has just reverted does not leave the
  // pane blank with no way back.
  const paths = (snapshot.files || []).map((f) => f.path);
  // A path in the fragment wins on first load, so a review can be linked at
  // one file and the selection survives a reload.
  if (!state.file) {
    const wanted = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (wanted && paths.includes(wanted)) { state.file = wanted; revealFile(wanted); }
  }
  // The tree's order, not the snapshot's: the page is laid out in the order the
  // navigator shows, so the file at the top of it is the first of those. Taking
  // the snapshot's first file instead had the navigator highlighting one file
  // while the page opened on another.
  if (!state.file || !paths.includes(state.file)) {
    const first = orderedFiles()[0];
    state.file = first ? first.path : null;
  }
  // Whatever is on screen is read by definition. This matters when the selection
  // has just fallen back because the file being read left the diff: without it a
  // dot could sit on the file the reader is looking at.
  if (state.file) readUnread(state.file);
  render();
  // The fragment is a link into one file, so honour it once the sections exist.
  // Once only: after that the reader's scroll owns the position, and the
  // fragment follows it rather than the other way round.
  if (!state.landed && state.file) {
    state.landed = true;
    const wanted = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (wanted && state.sections[wanted]) scrollToFile(wanted);
    else spyScroll(); // name whatever the page actually opened on
  }
}

// Expansion is remembered across a reload, keyed by this review's own token.
//
// localStorage rather than the host: the token is unique per session and the
// origin is this session's ephemeral port, so an entry dies with the review it
// belongs to and cannot leak into the next one. It is also the wrong thing to
// send through the host -- every click would be an HTTP round trip and a config
// write, for something that is only worth keeping until the page is closed.
//
// Every access is guarded: a private window, or a browser set to block site
// data, throws on the accessor itself rather than returning empty.
const EXPAND_KEY = "medusa-review-expand:" + location.pathname.replace(/\/$/, "").split("/").pop();

function loadExpansion() {
  try {
    const raw = window.localStorage.getItem(EXPAND_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && typeof saved === "object") state.expand = saved;
  } catch (err) {
    /* no memory of the last visit, which is only a lost convenience */
  }
}

function saveExpansion() {
  try {
    window.localStorage.setItem(EXPAND_KEY, JSON.stringify(state.expand));
    pruneExpansion();
  } catch (err) {
    /* nothing to do: the expansion still works, it just will not be remembered */
  }
}

// pruneExpansion drops what other reviews left behind.
//
// Each session writes under its own token and nothing else ever cleans those up,
// so without this the store would grow by one entry per review ever opened.
function pruneExpansion() {
  try {
    const stale = [];
    for (let i = 0; i < window.localStorage.length; i++) {
      const key = window.localStorage.key(i);
      if (key && key.startsWith("medusa-review-expand:") && key !== EXPAND_KEY) stale.push(key);
    }
    for (const key of stale) window.localStorage.removeItem(key);
  } catch (err) { /* nothing to prune with */ }
}

// dropStaleContext forgets the expanded context and cached lines of any file
// whose diff has moved.
//
// It is per file rather than per snapshot: an agent editing one file must not
// close up the context the reader has opened in another. The digest is the same
// signal a viewed mark is pinned to, so the two invalidate together.
function dropStaleContext(snapshot) {
  const live = {};
  for (const f of (snapshot && snapshot.files) || []) {
    live[f.path] = true;
    if (state.fileDigests[f.path] === f.digest) continue;
    state.fileDigests[f.path] = f.digest;
    // The cached *lines* are stale -- they came from a version of the file that
    // no longer exists -- but how far the reader had opened the context is not:
    // "twenty lines above this hunk" is still exactly what they asked for. It
    // used to be dropped with the rest, so an agent touching the file snapped
    // every expanded region shut under them. The counts stay, clampExpansion
    // fits them to the new hunks, and refillExpanded re-reads the lines.
    delete state.lineCache[f.path];
    delete state.lineTotal[f.path];
    delete state.hl[f.path];
  }
  // A file that has left the diff entirely keeps nothing either.
  for (const path of Object.keys(state.fileDigests)) {
    if (!live[path]) {
      delete state.fileDigests[path];
      delete state.expand[path];
      delete state.lineCache[path];
      delete state.lineTotal[path];
      delete state.hl[path];
    }
  }
}

function post(path, payload) {
  return fetch(API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
}

/* ---------------- live stream ---------------- */

function connect() {
  const es = new EventSource(API + "/live");
  es.onopen = () => setLive(true, "live");
  es.onmessage = (msg) => {
    let ev;
    try { ev = JSON.parse(msg.data); } catch (_) { return; }
    if (ev.notice) toast(ev.notice);
    if (ev.snapshot) {
      if (ev.threads !== undefined) announceAgentReplies(state.threads, ev.threads);
      apply(ev.snapshot, ev.threads !== undefined ? ev.threads : state.threads,
            ev.viewed, ev.autoSend, ev.split, ev.theme);
    } else {
      if (ev.threads !== undefined) {
        announceAgentReplies(state.threads, ev.threads);
        state.threads = ev.threads;
      }
      if (ev.viewed !== undefined) state.viewed = new Set(ev.viewed || []);
      if (ev.autoSend !== undefined) state.autoSend = !!ev.autoSend;
      if (ev.split !== undefined) state.split = !!ev.split;
      if (ev.theme !== undefined) state.theme = ev.theme || "";
      render();
    }
  };
  // EventSource reconnects on its own; the handler only has to report the gap,
  // because while it is down the page is showing a diff that may have moved.
  es.onerror = () => setLive(false, "reconnecting");
}

// announceAgentReplies reports a reply that arrived while the reader was looking
// somewhere else.
//
// It names the file and line rather than jumping there: the reader may be
// mid-comment on another file, and moving the view out from under them to show
// an answer is worse than letting them choose when to read it. Clicking the
// toast is the way there.
function announceAgentReplies(before, after) {
  const seen = new Map();
  for (const t of before || []) seen.set(t.id, (t.replies || []).length);
  for (const t of after || []) {
    const had = seen.has(t.id) ? seen.get(t.id) : 0;
    const now = (t.replies || []).length;
    if (now <= had) continue;
    const fresh = t.replies[now - 1];
    if (!fresh || fresh.author !== "agent") continue;
    if (t.path === state.file) continue; // already on screen, so already read
    markUnread(t.path, t.id);
    toast(agentName() + " replied on " + t.path + ":" + t.startLine + " — click to open", () => selectFile(t.path));
  }
}

function markUnread(path, threadID) {
  const seen = state.unread[path] || (state.unread[path] = new Set());
  seen.add(threadID);
}

// hasUnread answers for a file, and dirRow asks it of every file it covers so
// that folding a directory away cannot hide an unread reply.
function hasUnread(path) {
  const seen = state.unread[path];
  return !!seen && seen.size > 0;
}

// readUnread clears a file's unread marks and opens the cards that carried them.
//
// Clearing alone is not enough to call it read. A resolved thread starts
// collapsed, so an agent's reply to one would be marked read by a glance that
// could not possibly have included it; expanding those threads is what makes the
// reply actually on screen when the mark goes.
function readUnread(path) {
  const seen = state.unread[path];
  if (!seen) return;
  for (const id of seen) {
    state.expanded.add(id);
    state.collapsed.delete(id);
  }
  delete state.unread[path];
}

function setLive(on, text) {
  $("dot").className = "dot " + (on ? "on" : "off");
  $("livetext").textContent = text;
}

let toastTimer = null;
function toast(text, onclick) {
  const el = $("toast");
  el.textContent = text;
  el.classList.remove("hidden");
  el.style.cursor = onclick ? "pointer" : "default";
  el.onclick = onclick
    ? () => { el.classList.add("hidden"); el.onclick = null; onclick(); }
    : null;
  clearTimeout(toastTimer);
  // A reply the reader has to act on stays up longer than a passing notice.
  toastTimer = setTimeout(() => el.classList.add("hidden"), onclick ? 15000 : 6000);
}

/* ---------------- render ---------------- */

// captureTyping and restoreTyping carry the reader's cursor across a repaint.
//
// Keeping the text is not enough on its own. The diff repaints every couple of
// seconds while an agent works, and a repaint that restores the words but drops
// the caret to the start -- or drops focus entirely, so the next keystroke goes
// nowhere -- is only marginally better than losing the comment. The key is the
// textarea's identity rather than the element, since the element itself is gone
// by the time this has to find it again.
function captureTyping() {
  const el = document.activeElement;
  if (!el || el.tagName !== "TEXTAREA" || !el.dataset.typing) return null;
  return { key: el.dataset.typing, start: el.selectionStart, end: el.selectionEnd };
}

function restoreTyping(saved) {
  const key = (saved && saved.key) || state.focusKey;
  state.focusKey = null;
  if (!key) return;
  const el = document.querySelector('textarea[data-typing="' + key + '"]');
  if (!el) return;
  el.focus();
  // A box that was just opened puts the caret at the end of whatever is in it;
  // one the reader was already typing in keeps the selection exactly.
  const at = saved && saved.key === key
    ? [saved.start, saved.end]
    : [el.value.length, el.value.length];
  try { el.setSelectionRange(at[0], at[1]); } catch (err) { /* not focusable yet */ }
}

function render() {
  const snap = state.snapshot;
  if (!snap) return;
  const typing = captureTyping();
  $("ws").textContent = snap.workspace || "Review changes";
  renderBranchLine(snap);
  for (const btn of $("scope").querySelectorAll("button")) {
    btn.setAttribute("aria-selected", String(btn.dataset.scope === state.scope));
  }
  renderTheme();
  renderTitle();
  renderMode();
  for (const btn of $("view").querySelectorAll("button")) {
    btn.setAttribute("aria-selected", String((btn.dataset.split === "1") === state.split));
  }
  renderAgent(snap.agent || {});
  renderFiles();
  renderDiff();
  renderBar();
  if (snap.notice && snap.notice !== state.notice) { state.notice = snap.notice; toast(snap.notice); }
  restoreTyping(typing);
}

// renderTheme puts the reader's choice on the root element and lights the
// matching button.
//
// With no choice made the attribute is left off entirely rather than set to
// whatever the OS currently says: absent is what lets the media query answer, so
// the page keeps following the system as it changes through the day. The buttons
// still show which theme is *in effect*, asking the OS directly for that, so
// neither one is lit falsely.
function renderTheme() {
  const root = document.documentElement;
  if (state.theme === "light" || state.theme === "dark") {
    root.dataset.theme = state.theme;
  } else {
    delete root.dataset.theme;
  }

  const effective = state.theme || (prefersDark() ? "dark" : "light");
  for (const btn of $("theme").querySelectorAll("button")) {
    btn.setAttribute("aria-selected", String(btn.dataset.theme === effective));
  }
}

function prefersDark() {
  try {
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  } catch (err) {
    return false;
  }
}

// setTheme records the choice server-side, so the next review opens the same way.
//
// Painted before the round trip, like the layout: a theme that waited on the
// server to agree would make the button feel broken.
async function setTheme(theme) {
  state.theme = theme;
  render();
  const res = await post("/view", { theme: theme });
  if (!res.ok) { toast("Could not change the theme."); return; }
  const data = await res.json();
  state.theme = data.theme || "";
  render();
}

// renderTitle names the tab after the workspace and the file being read.
//
// It follows the selection, because the file is the part that moves as the
// reader navigates -- and a review left in a background tab is otherwise
// indistinguishable from any other. The base name rather than the path: the page
// already shows the path, and a title long enough to be clipped identifies
// nothing.
//
// Assigned only when it differs. render runs on every poll, and there is no
// reason to hand the browser the same string every two seconds.
function renderTitle() {
  const snap = state.snapshot || {};
  const workspace = snap.workspace || "";
  const file = state.file ? state.file.slice(state.file.lastIndexOf("/") + 1) : "";

  let title = "Review changes";
  if (workspace && file) title = workspace + " - " + file + " Changes";
  else if (workspace) title = workspace + " Changes";
  else if (file) title = file + " Changes";

  if (document.title !== title) document.title = title;
}

// renderMode shows the send mode. The label names the agent once it is known,
// so the toggle says what it will actually do rather than describing a
// mechanism.
function renderMode() {
  $("autosend").checked = state.autoSend;
  $("modelabel").classList.toggle("on", state.autoSend);
  $("modetext").textContent = state.autoSend
    ? "Sending to " + agentName() + " as I comment"
    : "Send as I comment";
}

// setAutoSend records the mode server-side and takes the answer from there.
//
// Turning it on delivers anything already queued, because the submit bar goes
// away with it -- see renderBar. That is reported rather than done quietly: the
// reader flipped a toggle and several comments left as a result.
async function setAutoSend(on) {
  const res = await post("/autosend", { autoSend: on });
  if (!res.ok) {
    toast("Could not change the send mode.");
    $("autosend").checked = state.autoSend;
    return;
  }
  const data = await res.json();
  state.autoSend = !!data.autoSend;
  if (data.threads) state.threads = data.threads;
  render();
  if (data.error) { toast(data.error); }
  else if (data.sending) {
    const n = (data.sent || []).length;
    toast("Sent " + n + " queued comment" + (n === 1 ? "" : "s") + " to " + agentName() + ".");
  }
}

// renderBranchLine names what is being compared, down to the commit.
//
// The base commit is shown, not just the base branch, because the base is
// derived rather than chosen and it moves under the reader: a rebase mid-session
// changes which commit "main" means for this review, and a bar reading only
// "main" gives them no way to tell. The subject rides along after it and is the
// first thing to be clipped, since the line is ellipsized -- the hash is what
// identifies the commit and the subject is what makes it recognisable.
function renderBranchLine(snap) {
  const el = $("branch");
  if (!snap.branch && !snap.base) { el.textContent = ""; el.title = ""; return; }

  let html = esc(snap.base || "");
  if (snap.baseRev) html += ' <span class="rev">' + esc(snap.baseRev) + "</span>";
  if (snap.base && snap.branch) html += " &larr; ";
  if (snap.branch) html += "<b>" + esc(snap.branch) + "</b>";
  if (snap.baseSubject) html += ' <span class="subject">&middot; ' + esc(snap.baseSubject) + "</span>";
  el.innerHTML = html;

  // The full thing as a tooltip, because the visible line is clipped to fit.
  el.title = [snap.base, snap.baseRev].filter(Boolean).join(" ") +
    (snap.branch ? " \u2190 " + snap.branch : "") +
    (snap.baseSubject ? "\n" + snap.baseSubject : "");
}

// agentName is what to call the agent in the interface. The page is opened
// against whichever tab is active, so this is never a constant.
function agentName() {
  const a = (state.snapshot && state.snapshot.agent) || {};
  return a.label || "the agent";
}

// renderAgent applies the agent's name to the interface and raises the banner
// when that agent cannot reply.
//
// The banner is shown rather than worked around on purpose: the alternative
// discussed was a second, file-based reply channel, and silently routing around
// a sandbox the user chose is not this page's decision to make. Saying so lets
// them either accept it or turn network access on.
function renderAgent(agent) {
  $("submit").textContent = "Submit to " + agentName();

  const banner = $("banner");
  if (agent.canReply || !agent.blocked || state.bannerDismissed) {
    banner.classList.add("hidden");
    return;
  }
  $("banner-title").textContent = agentName() + " cannot reply to comments. ";
  $("banner-text").textContent = agent.blocked;
  $("banner-fix").textContent = agent.fix || "";
  banner.classList.remove("hidden");
}

function threadsFor(path) {
  return state.threads.filter((t) => t.path === path);
}

function renderFiles() {
  const files = state.snapshot.files || [];
  const add = files.reduce((n, f) => n + f.added, 0);
  const del = files.reduce((n, f) => n + f.removed, 0);
  // The read count is only shown once something has been read: on a fresh
  // review "0 read" is noise, and the number is only interesting as progress.
  const read = files.filter((f) => state.viewed.has(f.path)).length;
  $("navhead").innerHTML = files.length
    ? files.length + " file" + (files.length === 1 ? "" : "s") +
      (read ? " &middot; " + read + " read" : "") +
      ' <span class="stat"><span class="a">+' + add + '</span> <span class="d">-' + del + "</span></span>"
    : "No changes";

  const list = $("filelist");
  list.innerHTML = "";
  appendNodes(buildTree(files), 0, list);
}

// buildTree turns the flat path list into the directory structure it describes.
//
// Every node also keeps `all`: each file is pushed into all of its ancestors, so
// a shut folder can report what is inside it without walking the tree again.
function buildTree(files) {
  const root = { name: "", path: "", dirs: new Map(), files: [], all: [] };
  for (const f of files) {
    const parts = f.path.split("/");
    let node = root;
    node.all.push(f);
    for (let i = 0; i < parts.length - 1; i++) {
      const seg = parts[i];
      let next = node.dirs.get(seg);
      if (!next) {
        next = {
          name: seg, path: node.path ? node.path + "/" + seg : seg,
          dirs: new Map(), files: [], all: [],
        };
        node.dirs.set(seg, next);
      }
      node = next;
      node.all.push(f);
    }
    node.files.push(f);
  }
  return root;
}

// collapseChain folds a run of single-child directories into one row, so a Go
// repository reads as `internal/gitreview` rather than as four nested folders
// each holding nothing but the next.
//
// The row is keyed by the deepest path in the chain, which is the one whose
// contents the twisty actually shows.
function collapseChain(node) {
  let label = node.name;
  while (node.files.length === 0 && node.dirs.size === 1) {
    node = node.dirs.values().next().value;
    label += "/" + node.name;
  }
  return { node: node, label: label };
}

// appendNodes renders one level: folders first, then the files that live at it.
// Depth is rendered as indentation rather than as nested lists, so a row's
// height never depends on how deep it sits.
function appendNodes(node, depth, list) {
  const dirs = Array.from(node.dirs.values()).sort((a, b) => a.name.localeCompare(b.name));
  for (const d of dirs) {
    const chain = collapseChain(d);
    const shut = state.dirsCollapsed.has(chain.node.path);
    list.appendChild(dirRow(chain, depth, shut));
    if (!shut) appendNodes(chain.node, depth + 1, list);
  }
  const leaves = node.files.slice().sort((a, b) => a.path.localeCompare(b.path));
  for (const f of leaves) list.appendChild(fileRow(f, depth));
}

// indent converts a tree depth to a left padding, matching the row padding at
// depth zero.
function indent(depth) { return 9 + depth * 13; }

function dirRow(chain, depth, shut) {
  const li = document.createElement("li");
  li.className = "dir";
  const inside = chain.node.all;
  const added = inside.reduce((n, f) => n + f.added, 0);
  const removed = inside.reduce((n, f) => n + f.removed, 0);
  const threads = inside.reduce((acc, f) => acc.concat(threadsFor(f.path)), []);
  const unread = inside.some((f) => hasUnread(f.path));

  // Counts are shown only while the folder is shut. Open, they duplicate the
  // rows immediately below; shut, they are the only sign that anything in there
  // has changed or has a comment waiting on it.
  li.innerHTML =
    '<button type="button" style="padding-left:' + indent(depth) + 'px">' +
    '<span class="tw">' + (shut ? "\u25b8" : "\u25be") + "</span>" +
    '<span class="fname"><span class="base">' + esc(chain.label) + "/</span></span>" +
    (shut ? badgeHTML(threads, unread) + statHTML(added, removed) : "") +
    "</button>";
  li.querySelector("button").onclick = () => {
    if (shut) state.dirsCollapsed.delete(chain.node.path);
    else state.dirsCollapsed.add(chain.node.path);
    render();
  };
  return li;
}

function fileRow(f, depth) {
  const li = document.createElement("li");
  const seen = state.viewed.has(f.path);
  li.className = (f.path === state.file ? "sel" : "") + (seen ? " seen" : "");
  // Only the base name: the tree above it already says where the file is, and
  // repeating the directory on every row is what made the flat list unreadable.
  const base = f.path.slice(f.path.lastIndexOf("/") + 1);
  // The tick sits in the column the folders use for their twisty, so the ticks
  // line up down the left edge instead of competing with the comment badge on
  // the right -- which means something else entirely.
  li.innerHTML =
    '<button type="button" style="padding-left:' + indent(depth) + 'px" title="' + esc(f.path) + '">' +
    '<span class="tw">' + (seen ? "\u2713" : "") + "</span>" +
    '<span class="fname"><span class="base">' + esc(base) + "</span></span>" +
    badgeHTML(threadsFor(f.path), hasUnread(f.path)) + statHTML(f.added, f.removed) +
    "</button>";
  li.querySelector("button").onclick = () => { selectFile(f.path); };
  return li;
}

// setViewed ticks a file, or clears the tick.
//
// The server owns the answer -- it pins the mark to the digest of the diff on
// screen -- so nothing is assumed here; the live stream brings the new state
// back, which is also what keeps a second tab in step.
async function setViewed(path, viewed) {
  const res = await post("/viewed", { path: path, viewed: viewed });
  if (!res.ok) { toast("Could not mark that file."); return; }
  const data = await res.json();
  if (data.viewed) { state.viewed = new Set(data.viewed); render(); }
}

// badgeHTML marks a row with what is still outstanding on it: a count of
// unresolved comments, and a dot when the agent has replied somewhere the reader
// has not looked.
//
// A file whose comments are all resolved gets nothing. It used to get a tick,
// on the reasoning that a thread which vanishes on resolve looks like it was
// never there -- but a navigator marked up with finished work competes with the
// work that is left, which is the only thing the column is for. The comments are
// still on the file when it is opened.
function badgeHTML(threads, unread) {
  let out = "";
  const open = threads.filter((t) => !t.resolved).length;
  if (open) out += '<span class="badge">' + open + "</span>";
  if (unread) {
    out += '<span class="badge new" title="' + esc(agentName()) +
      ' has replied here">\u25cf</span>';
  }
  return out;
}

function statHTML(added, removed) {
  return '<span class="stat"><span class="a">+' + added + '</span> <span class="d">-' + removed + "</span></span>";
}

// revealFile opens every folder above a path, so selecting a file the reader had
// folded away does not leave the navigator showing no selection at all.
function revealFile(path) {
  const parts = String(path || "").split("/");
  let prefix = "";
  for (let i = 0; i < parts.length - 1; i++) {
    prefix = prefix ? prefix + "/" + parts[i] : parts[i];
    state.dirsCollapsed.delete(prefix);
  }
}

// selectFile switches the diff pane and records the choice in the fragment.
// selectFile scrolls to a file rather than swapping the pane to it.
//
// Every file is already on the page, so the navigator's job is to move the
// reader, not to choose what exists. The spy is muted for the length of the
// scroll: it would otherwise call every file the scroll passes over the current
// one and rewrite the navigator, the title and the URL a dozen times on the way.
function selectFile(path) {
  state.file = path;
  revealFile(path);
  readUnread(path);
  scrollToFile(path);
  // replaceState, not a hash assignment: writing location.hash pushes a history
  // entry per file, so Back would walk the files instead of leaving the review.
  history.replaceState(null, "", location.pathname + location.search + "#" + encodeURIComponent(path));
  render();
}

function scrollToFile(path) {
  const section = state.sections[path];
  if (!section) return;
  state.scrollingTo = path;
  section.el.scrollIntoView({ block: "start" });
  // Long enough for a smooth scroll to land, short enough that the spy is not
  // deaf if one never happens.
  clearTimeout(scrollMute);
  scrollMute = setTimeout(() => { state.scrollingTo = null; }, 400);
}

let scrollMute = null;

/* ---------------- expanding the context around a hunk ---------------- */

// EXPAND_STEP is how many lines one click opens up.
const EXPAND_STEP = 20;
const HUNK_HEADER = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/;

// hunkRange reads a hunk's position in both images out of its @@ header.
//
// The header is parsed rather than derived from the rows, because a hunk of pure
// deletions has no line on the new side at all and still has a position there --
// which is exactly the position the gap below it is measured from.
function hunkRange(hunk) {
  const m = HUNK_HEADER.exec((hunk && hunk.header) || "");
  if (!m) return null;
  const oldStart = +m[1], oldCount = m[2] === undefined ? 1 : +m[2];
  const newStart = +m[3], newCount = m[4] === undefined ? 1 : +m[4];
  return {
    oldStart: oldStart, newStart: newStart,
    oldEnd: oldStart + oldCount - 1, newEnd: newStart + newCount - 1,
  };
}

// clampExpansion fits remembered expansion counts to the diff as it is now.
//
// It has to run before anything reads them. A count kept across a change -- or
// restored from a previous visit -- was measured against hunks that may have
// moved, and one that overshoots its gap would render lines belonging to the
// hunk above: the same line twice, in two places, with no sign that anything
// was wrong.
//
// The last hunk's downward count is left alone while the file's length is
// unknown, because gapBelow answers 0 in that case and clamping to it would
// throw away a perfectly good expansion the moment the file changed.
function clampExpansion(file) {
  const perFile = state.expand[file.path];
  if (!perFile) return;
  const hunks = file.hunks || [];
  const knownTotal = state.lineTotal[file.path] !== undefined;

  for (const key of Object.keys(perFile)) {
    if (+key >= hunks.length) delete perFile[key];
  }
  for (let i = 0; i < hunks.length; i++) {
    const open = perFile[i];
    if (!open) continue;
    open.up = Math.max(0, Math.min(open.up, gapAbove(file, i)));
    if (i < hunks.length - 1 || knownTotal) {
      open.down = Math.max(0, Math.min(open.down, gapBelow(file, i)));
    }
  }
  // A gap is shared by the hunks either side of it, so the two counts opening
  // into it must not sum past it. The one below gives way, arbitrarily but
  // deterministically -- what matters is that they never overlap.
  for (let i = 1; i < hunks.length; i++) {
    const gap = gapAbove(file, i);
    const below = perFile[i - 1] ? perFile[i - 1].down : 0;
    if (perFile[i] && perFile[i].up + below > gap) {
      perFile[i].up = Math.max(0, gap - below);
    }
  }
}

// refillExpanded re-reads the lines an expansion needs but no longer has.
//
// Between them, clampExpansion and this are what make an expansion survive the
// file changing underneath it: the counts are kept, trimmed to fit, and the
// lines behind them fetched again. Without it the counts would be right and the
// rows would silently render short, since effectiveLines skips any line it
// cannot find in the cache.
const refillPending = new Set();

function refillExpanded(file) {
  const perFile = state.expand[file.path];
  if (!perFile) return;
  const cache = state.lineCache[file.path];
  const hunks = file.hunks || [];

  let from = Infinity;
  let to = 0;
  for (let i = 0; i < hunks.length; i++) {
    const open = perFile[i];
    const r = hunkRange(hunks[i]);
    if (!open || !r) continue;
    for (let k = 1; k <= open.up; k++) {
      const n = r.newStart - k;
      if (n >= 1 && !(cache && cache.has(n))) { from = Math.min(from, n); to = Math.max(to, n); }
    }
    for (let k = 1; k <= open.down; k++) {
      const n = r.newEnd + k;
      if (!(cache && cache.has(n))) { from = Math.min(from, n); to = Math.max(to, n); }
    }
  }
  if (to === 0 || from > to) return;

  // One request for the whole span, gaps included: two reads of one file cost
  // more than one read of a few extra lines, and the extra lines are ones the
  // reader is quite likely to open next anyway.
  const key = file.path + ":" + from + "-" + to;
  if (refillPending.has(key)) return;
  refillPending.add(key);
  fetchLines(file.path, from, to, true).then((got) => {
    refillPending.delete(key);
    if (got > 0) render();
  });
}

function expandState(path, i) {
  const perFile = state.expand[path] || (state.expand[path] = {});
  return perFile[i] || (perFile[i] = { up: 0, down: 0 });
}

// gapAbove and gapBelow measure the unchanged run on each side of a hunk.
//
// A gap is the same length in both images -- nothing changed in it, by
// definition -- which is what lets an expanded line carry both an old and a new
// number without consulting git again.
function gapAbove(file, i) {
  const r = hunkRange(file.hunks[i]);
  if (!r) return 0;
  if (i === 0) return Math.max(0, r.newStart - 1);
  const prev = hunkRange(file.hunks[i - 1]);
  return prev ? Math.max(0, r.newStart - prev.newEnd - 1) : 0;
}

function gapBelow(file, i) {
  const r = hunkRange(file.hunks[i]);
  if (!r) return 0;
  if (i < file.hunks.length - 1) {
    const next = hunkRange(file.hunks[i + 1]);
    return next ? Math.max(0, next.newStart - r.newEnd - 1) : 0;
  }
  // Below the last hunk the answer needs the file's length, which the snapshot
  // deliberately does not carry: counting it would mean reading every changed
  // file on every two-second poll. Until it is known the answer is zero, not a
  // guess -- offering the expander optimistically put a bar at the foot of every
  // diff whose last hunk already reached the end of the file, an arrow that did
  // nothing. ensureLineTotal asks once, for the file on screen only.
  const total = state.lineTotal[file.path];
  return total === undefined ? 0 : Math.max(0, total - r.newEnd);
}

// roomAbove and roomBelow subtract what is already open. A gap is shared by the
// hunks on either side of it, so each has to account for the other's expansion
// or the two would overlap and render the same lines twice.
function roomAbove(file, i) {
  const opposite = i > 0 ? expandState(file.path, i - 1).down : 0;
  return Math.max(0, gapAbove(file, i) - expandState(file.path, i).up - opposite);
}

function roomBelow(file, i) {
  const opposite = i < file.hunks.length - 1 ? expandState(file.path, i + 1).up : 0;
  return Math.max(0, gapBelow(file, i) - expandState(file.path, i).down - opposite);
}

// contextLine builds a row for an expanded line.
//
// The leading space is git's own context marker, which splitMarker takes off
// again, so an expanded line renders exactly as a context line from the diff
// does -- and can be commented on the same way, since it carries real numbers.
function contextLine(text, oldNo, newNo) {
  return { kind: "context", content: " " + text, old: oldNo, new: newNo, expanded: true };
}

// effectiveLines is what actually gets rendered for a hunk: the expanded context
// above it, the hunk itself, then the expanded context below.
//
// Returning one flat list matters beyond tidiness. Range selection indexes into
// it, so expanded lines are draggable and commentable exactly like the diff's
// own, with no second code path to keep in step.
function effectiveLines(file, i) {
  const hunk = file.hunks[i];
  const r = hunkRange(hunk);
  if (!r) return hunk.lines || [];
  const open = expandState(file.path, i);
  const cache = state.lineCache[file.path];
  const out = [];

  for (let k = open.up; k >= 1; k--) {
    const n = r.newStart - k;
    const text = cache && cache.get(n);
    if (n < 1 || text === undefined) continue;
    out.push(contextLine(text, r.oldStart - k, n));
  }
  for (const line of hunk.lines || []) out.push(line);
  for (let k = 1; k <= open.down; k++) {
    const n = r.newEnd + k;
    const text = cache && cache.get(n);
    if (text === undefined) continue;
    out.push(contextLine(text, r.oldEnd + k, n));
  }
  return out;
}

// totalsPending stops a render from asking again while an answer is in flight.
// The pane repaints every couple of seconds, so without it the poll would fire a
// request per tick.
const totalsPending = new Set();

// ensureLineTotal learns the length of the file on screen, so the foot expander
// can say truthfully whether anything is below the last hunk.
//
// One request per file per digest, and only for the file being looked at -- the
// cost the snapshot could not carry was reading *every* changed file on *every*
// poll. Line 1 is asked for because the response's `total` is the point; its
// text is cached alongside and is a real line, so nothing is wasted.
//
// Untracked files are skipped: their diff is the whole file already
// (`@@ -0,0 +1,N @@`), so there is provably nothing below it.
function ensureLineTotal(file) {
  if (!file || file.untracked || file.binary || file.large) return;
  if (!file.hunks || !file.hunks.length) return;
  if (state.lineTotal[file.path] !== undefined) return;
  if (totalsPending.has(file.path)) return;

  totalsPending.add(file.path);
  fetchLines(file.path, 1, 1, true).then(() => {
    totalsPending.delete(file.path);
    // Only repaint if the answer arrived; an unreadable file leaves the total
    // unknown, which reads as "nothing below" and needs no repaint.
    if (state.lineTotal[file.path] !== undefined) render();
  });
}

// fetchLines reads a run of the file and returns how many lines came back.
//
// The count is the return value rather than the lines because the caller only
// advances its expansion by what it actually got: a request that ran off the end
// of the file must open up that much and no more.
// A read the reader did not ask for -- the one that measures the file -- must
// not toast: a deleted or unreadable file would otherwise report an error for
// simply having been opened.
async function fetchLines(path, from, to, quiet) {
  const q = new URLSearchParams({ path: path, from: String(from), to: String(to) });
  const complain = (msg) => { if (!quiet) toast(msg); };
  let data;
  try {
    const res = await fetch(API + "/lines?" + q.toString());
    if (!res.ok) { complain("Could not read more of " + path); return 0; }
    data = await res.json();
  } catch (err) {
    complain("Could not read more of " + path);
    return 0;
  }
  if (data.error) { complain(data.error); return 0; }
  if (data.total) state.lineTotal[path] = data.total;

  const cache = state.lineCache[path] || (state.lineCache[path] = new Map());
  (data.lines || []).forEach((text, k) => cache.set(data.from + k, text));
  return (data.lines || []).length;
}

// expandHunk opens the context in one direction by up to EXPAND_STEP lines.
//
// The lines are fetched before the counter moves, so a render never asks for a
// line that is not cached and no half-open state is ever on screen.
async function expandHunk(file, i, dir) {
  const r = hunkRange(file.hunks[i]);
  if (!r) return;
  const open = expandState(file.path, i);
  const room = dir === "up" ? roomAbove(file, i) : roomBelow(file, i);
  if (room <= 0) return;

  const step = Math.min(EXPAND_STEP, room);
  let from, to;
  if (dir === "up") {
    to = r.newStart - open.up - 1;
    from = Math.max(1, to - step + 1);
  } else {
    from = r.newEnd + open.down + 1;
    to = from + step - 1;
  }
  if (to < from) return;

  const got = await fetchLines(file.path, from, to);
  // Even a read that returned nothing is worth a repaint: it will have reported
  // the file's length, which is what takes a dead expander off the last hunk.
  if (got > 0) {
    open[dir] += got;
    saveExpansion();
  }
  render();
}

function expandButton(glyph, title, onclick) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = glyph;
  b.title = title;
  b.onclick = onclick;
  return b;
}

// gapBar is the bar for the run of hidden lines above hunk `i`, or -- when `i`
// is one past the last hunk -- for the tail of the file after it. It returns
// null when nothing is hidden there.
//
// One bar per gap, drawn *at* the gap. The two directions are the same run of
// hidden lines seen from its two ends -- roomAbove(i) and roomBelow(i-1) measure
// it identically -- so one bar offers both:
//
//   ▲  the lines *before* the hunk below the bar   (expandHunk(i, "up"))
//   ▼  the lines *after* the hunk above the bar    (expandHunk(i-1, "down"))
//
// Each arrow reveals what lies in the direction it points, counted from the
// nearest visible line on the far side of the gap: at a bar between line 24 and
// line 142, ▲ shows what comes before 142 and ▼ shows what comes after 24. It
// was the other way round first, which reads just as coherently written down and
// not at all when you are looking at it.
//
// That the bar is *at* the gap matters separately. The downward arrow used to
// live in a hunk's header, at the top of the hunk, while the lines it revealed
// appeared at the bottom -- off screen for any hunk taller than the viewport.
// And a header is only drawn while something is hidden above its hunk, so
// opening the gap above a hunk took away the arrow that opened the gap below it.
//
// The label is the `@@` header of the hunk below, which is what the gap is a
// discontinuity in front of; the tail gap has no hunk below it and so no label.
function gapBar(file, i) {
  const hunks = file.hunks || [];
  const tail = i >= hunks.length;
  const room = tail ? roomBelow(file, hunks.length - 1) : roomAbove(file, i);
  if (room <= 0) return null;

  const el = document.createElement("div");
  el.className = "hunk-head" + (tail ? " foot" : "");
  const acts = document.createElement("span");
  acts.className = "hunk-acts";

  // ▲ walks back from the code *below* the bar, ▼ walks on from the code
  // *above* it -- so each arrow reveals the lines that lie in the direction it
  // points, counted from the nearest visible line on the far side of the gap.
  // The tooltips name that line, because an arrow in the middle of a gap has
  // two plausible readings and a number has one.
  if (!tail) {
    const below = hunkRange(hunks[i]);
    acts.appendChild(expandButton("▲",
      below ? "Show the lines before " + below.newStart : "Show the lines above",
      () => expandHunk(file, i, "up")));
  }
  if (i > 0) {
    const above = hunkRange(hunks[i - 1]);
    acts.appendChild(expandButton("▼",
      above ? "Show the lines after " + above.newEnd : "Show the lines below",
      () => expandHunk(file, i - 1, "down")));
  }
  el.appendChild(acts);
  if (!tail) {
    const label = document.createElement("span");
    label.textContent = hunks[i].header;
    el.appendChild(label);
  }
  return el;
}

/* ---------------- comment anchoring ---------------- */

// coversLine reports whether a comment is about this line.
//
// endLine is trusted only when it is at or past startLine: a single-line comment
// may carry either, and treating a missing one as 0 would leave a range that
// covers nothing at all.
function coversLine(t, line) {
  const n = t.side === "old" ? line.old : line.new;
  if (!n) return false;
  const end = t.endLine > t.startLine ? t.endLine : t.startLine;
  return n >= t.startLine && n <= end;
}

// placeThreads decides which rendered row each comment card sits under: the
// **last** row of its range that this diff actually shows.
//
// Under, not over. A card above its range separates the comment from the code by
// however many lines it covers, and the reader has to guess downwards to find
// what it is about; after the last line, the range reads as the quote and the
// card as the response to it.
//
// Iterating in render order and keeping the latest match is also what makes a
// range spanning two hunks land at its true end, and what identifies the
// comments that have no row left at all.
function placeThreads(file, threads, linesByHunk) {
  const at = new Map();
  for (let i = 0; i < linesByHunk.length; i++) {
    for (const line of linesByHunk[i]) {
      for (const t of threads) {
        if (coversLine(t, line)) {
          at.set(t.id, { hunk: i, line: t.side === "old" ? line.old : line.new });
        }
      }
    }
  }
  return at;
}

/* ---------------- syntax highlighting ---------------- */

// EXT_LANG and NAME_LANG map a file onto a highlight.js language id.
//
// An explicit map, rather than letting highlight.js guess: auto-detection on a
// fragment of a diff picks the wrong language often enough to be worse than no
// colour, and it does it silently. Anything unmapped -- or mapped to a language
// this bundle does not carry -- renders as plain text, which is the honest
// answer and exactly what happens today.
const EXT_LANG = {
  go: "go",
  js: "javascript", mjs: "javascript", cjs: "javascript", jsx: "javascript",
  ts: "typescript", tsx: "typescript",
  py: "python", rb: "ruby", rs: "rust", java: "java", kt: "kotlin", kts: "kotlin",
  swift: "swift", cs: "csharp", php: "php", lua: "lua", pl: "perl", pm: "perl", r: "r",
  c: "c", h: "c", cc: "cpp", cpp: "cpp", cxx: "cpp", hpp: "cpp", hh: "cpp",
  sh: "bash", bash: "bash", zsh: "bash", fish: "bash",
  json: "json", jsonc: "json",
  yaml: "yaml", yml: "yaml",
  toml: "ini", ini: "ini", cfg: "ini", conf: "ini",
  css: "css", scss: "scss", sass: "scss", less: "less",
  html: "xml", htm: "xml", xml: "xml", svg: "xml", vue: "xml",
  md: "markdown", markdown: "markdown",
  sql: "sql", graphql: "graphql", gql: "graphql",
  diff: "diff", patch: "diff",
  mk: "makefile",
};

const NAME_LANG = {
  makefile: "makefile", "gnumakefile": "makefile",
  ".bashrc": "bash", ".zshrc": "bash", ".profile": "bash",
  ".gitignore": "plaintext", ".gitattributes": "plaintext",
};

// MAX_HL_BYTES bounds one lexing pass. See the note where it is checked.
const MAX_HL_BYTES = 200000;

// languageFor resolves a path to a language the loaded bundle actually has.
//
// The getLanguage check is what makes a smaller bundle degrade instead of
// throwing: highlight.js raises on an unregistered language rather than falling
// back, so asking for one it does not carry would take the diff pane down.
function languageFor(path) {
  if (typeof hljs === "undefined") return null;
  const base = String(path || "").slice(String(path || "").lastIndexOf("/") + 1).toLowerCase();
  const byName = NAME_LANG[base];
  if (byName) return hljs.getLanguage(byName) ? byName : null;
  const dot = base.lastIndexOf(".");
  if (dot <= 0) return null;
  const lang = EXT_LANG[base.slice(dot + 1)];
  return lang && hljs.getLanguage(lang) ? lang : null;
}

// splitHighlighted turns one highlighted block into per-line HTML.
//
// highlight.js nests spans, and a construct that crosses a newline -- a Python
// docstring, a JS template literal, a C block comment -- leaves one open across
// it. Cutting the string at newlines would put an unclosed span in one table
// cell and a stray closing tag in another, so what is open is closed at each
// break and reopened on the next line.
//
// The scan only has to understand `<span class="...">` and `</span>`, because
// that is the whole of highlight.js's output; everything else in it is escaped
// text.
function splitHighlighted(html) {
  const lines = [];
  const open = [];
  let cur = "";
  let i = 0;
  while (i < html.length) {
    const ch = html[i];
    if (ch === "<") {
      const end = html.indexOf(">", i);
      if (end < 0) { cur += html.slice(i); break; }
      const tag = html.slice(i, end + 1);
      if (tag[1] === "/") open.pop();
      else open.push(tag);
      cur += tag;
      i = end + 1;
    } else if (ch === "\n") {
      lines.push(cur + "</span>".repeat(open.length));
      cur = open.join("");
      i++;
    } else {
      let stop = html.length;
      const tag = html.indexOf("<", i);
      const nl = html.indexOf("\n", i);
      if (tag >= 0) stop = Math.min(stop, tag);
      if (nl >= 0) stop = Math.min(stop, nl);
      cur += html.slice(i, stop);
      i = stop;
    }
  }
  lines.push(cur + "</span>".repeat(open.length));
  return lines;
}

// highlightRows returns the per-row HTML for a hunk, aligned to `lines`, with a
// null wherever a row has no highlighting.
//
// Each side is lexed as one block, not each row on its own. A hunk's rows are
// not source: they interleave a removed line with the line that replaced it, so
// joining them hands the lexer text that never existed in any file. The
// post-image rows (context and added) *are* contiguous source, and so are the
// pre-image rows (context and removed) -- so those are the two strings that get
// highlighted. That is what lets a multi-line construct inside the hunk come out
// right, and it costs two calls per hunk rather than one per line. A construct
// that opens *before* the hunk is still read wrong; expanding the context is the
// answer to that, and it is why expanded rows are lexed with everything else.
function highlightRows(lines, lang) {
  const out = new Array(lines.length).fill(null);
  if (!lang) return out;

  const newRows = [], newSrc = [], oldRows = [], oldSrc = [];
  lines.forEach((line, i) => {
    // Not a line of the file: git's "\ No newline at end of file" carries a
    // number on neither side, and feeding it in would shift every line after it
    // onto the wrong row.
    if (!line.old && !line.new) return;
    const text = splitMarker(line.content)[1];
    if (line.kind !== "del") { newRows.push(i); newSrc.push(text); }
    if (line.kind !== "add") { oldRows.push(i); oldSrc.push(text); }
  });

  const paint = (rows, src) => {
    if (!rows.length) return;
    // A file under git's 2MB "large" threshold can still be one minified line
    // of half a megabyte, and lexing that is measured in seconds rather than
    // milliseconds. Plain text is the right answer for it anyway: nobody reads
    // a minified bundle for its keywords.
    const source = src.join("\n");
    if (source.length > MAX_HL_BYTES) return;
    let html;
    try {
      // hljs escapes its input, so the only markup in the result is its own
      // spans. That is what makes the innerHTML at the call site safe -- the
      // line's text is never treated as markup.
      html = splitHighlighted(
        hljs.highlight(source, { language: lang, ignoreIllegals: true }).value);
    } catch (err) {
      return; // plain text is always an acceptable answer
    }
    rows.forEach((row, k) => { if (html[k] !== undefined) out[row] = html[k]; });
  };
  // Old first, so a context row -- which is in both -- ends up carrying the
  // post-image result: that is the code that exists now.
  paint(oldRows, oldSrc);
  paint(newRows, newSrc);
  return out;
}

// highlightFor memoises highlightRows for one hunk.
//
// The diff pane is rebuilt on every repaint -- a poll, a selection, a comment --
// so without this the same lines are lexed several times a second. The key
// carries how far the context is opened, because expanding changes which lines
// the hunk holds; the whole entry is dropped when the file's digest moves, in
// dropStaleContext, alongside the cached lines it was computed from.
function highlightFor(file, hunkIdx, lines, lang) {
  if (!lang) return new Array(lines.length).fill(null);
  const open = expandState(file.path, hunkIdx);
  // The line count is part of the key, not just how far the context is opened.
  // Those two used to be the same thing, because a count only ever moved after
